<!doctype html>
<html lang="am">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Aviator</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:#07111d;--card:#101f30;--green:#24d18b;--red:#ff435f;--muted:#9aadc1;--gold:#ffcf57}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#132941 0,#07111d 48%);color:#f4f7fb;font-family:Arial,sans-serif;min-height:100vh}
.wrap{max-width:680px;margin:auto;padding:15px}
.top,.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-size:23px;font-weight:900;letter-spacing:.3px}.brand em{font-style:normal;color:var(--red)}
.muted{color:var(--muted);font-size:12px}.balance{font-size:20px;font-weight:900;color:var(--green);margin-top:4px}
.pill{border:1px solid #2b435a;border-radius:30px;padding:7px 10px;color:#c9d8e8;font-size:11px;background:#0b1927}

/* CINEMATIC AVIATOR STAGE */
.stage{position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(160deg,#102d48,#06101c 75%);height:310px;border:1px solid #2f5270;border-radius:20px;margin-top:15px;box-shadow:0 14px 38px #0007;perspective:900px}
.clouds{position:absolute;inset:0;background-image:radial-gradient(circle, rgba(255,255,255,0.2) 1.5px, transparent 2px), radial-gradient(circle, rgba(255,255,255,0.1) 3px, transparent 3px);background-size:140px 140px, 220px 220px;background-position:0 0, 70px 70px;opacity:.6;animation:driftClouds 18s linear infinite;pointer-events:none;z-index:1}
@keyframes driftClouds{from{background-position:0 0, 70px 70px}to{background-position:-700px 0, -650px 70px}}

.stage-top{position:absolute;left:14px;right:14px;top:13px;display:flex;justify-content:space-between;align-items:center;z-index:4}
.live{display:flex;align-items:center;gap:6px;font-size:11px;color:#ff8293;font-weight:bold;letter-spacing:1px}.dot{width:7px;height:7px;background:var(--red);border-radius:50%;box-shadow:0 0 12px var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35;transform:scale(.8)}}

.status{position:absolute;top:142px;left:0;right:0;text-align:center;color:#b8c8d7;font-size:12px;z-index:3}
.flight{position:absolute;inset:0;overflow:hidden;z-index:2}

/* የበረራ መስመር (Takeoff Curve Line) */
.flightline{position:absolute;left:0;bottom:0;width:100%;height:100%;pointer-events:none;z-index:2;opacity:0;transition:opacity .3s}
.stage.flying .flightline{opacity:1}

/* ከታች ተነስቶ ወደ ላይ የሚሄደው አውሮፕላን (Bottom-Left Origin) */
#planeWrap{
  position: absolute;
  left: 20px;
  bottom: 20px;
  width: 70px;
  height: 50px;
  z-index: 3;
  transform-origin: center center;
  transition: transform .15s linear;
  will-change: transform;
}

#plane{
  font-size: 48px;
  display: block;
  transform: rotate(0deg);
  filter: drop-shadow(0 0 10px #ff435f);
}

.stage.flying #plane {
  animation: planeFloat .4s ease-in-out infinite alternate;
}
@keyframes planeFloat {
  from { transform: translateY(0px) rotate(0deg); }
  to { transform: translateY(-4px) rotate(2deg); }
}

.mult{
  position: absolute;
  top: 65px;
  left: 0;
  right: 0;
  text-align: center;
  font-size: clamp(48px,12vw,68px);
  font-weight: 1000;
  letter-spacing: -2px;
  z-index: 3;
  text-shadow: 0 0 15px #ffffff44, 0 6px 20px #000;
}
.mult.flying{color:#fff}
.mult.crashed{color:#ff435f;animation:shakeMult .3s ease;text-shadow:0 0 25px #ff1839aa}
@keyframes shakeMult{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* CRASH EFFECTS */
.stage.crashed{animation:crashShake .45s ease-out;border-color:#ff263f;box-shadow:inset 0 0 70px #ff183955}
@keyframes crashShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.crash-flash{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;background:radial-gradient(circle at center,#fff 0%,#ffb13b 20%,#ff283e99 45%,transparent 70%)}
.stage.crashed .crash-flash{animation:impactFlash .55s ease-out}
@keyframes impactFlash{0%{opacity:.95}100%{opacity:0}}

.panel{background:linear-gradient(145deg,#122338,#0d1a29);border:1px solid #243a50;border-radius:17px;padding:14px;margin-top:13px;box-shadow:0 8px 25px #0002}
input,button{font:inherit;border-radius:11px;padding:13px;border:0}
input{background:#07111d;color:white;width:100%;border:1px solid #30475c;margin:11px 0 10px;outline:none}
input:focus{border-color:#24d18b}
.quick{display:flex;gap:8px}.quick button{flex:1;background:#20364b;color:#e6eef7;border:1px solid #304a61;padding:10px 5px;font-weight:bold}
.primary{width:100%;background:linear-gradient(135deg,#2ae49a,#16b978);color:#04140e;margin-top:10px;font-weight:900;box-shadow:0 5px 16px #24d18b22}
.cash{background:linear-gradient(135deg,#ffdb69,#ffb62f);color:#261900;box-shadow:0 5px 16px #ffce5722}
.primary:disabled{opacity:.4;box-shadow:none}
.msg{padding:10px 12px;border-radius:10px;margin-top:10px;background:#213448;display:none;font-size:13px;line-height:1.45}
.hist{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.chip{padding:7px 10px;border-radius:20px;background:#203348;border:1px solid #2d465d;font-size:12px;font-weight:bold}.chip.high{color:#d8a6ff;border-color:#73569a;background:#2a2040}.chip.mid{color:#69e4b0;border-color:#286c55}.chip.low{color:#ff8b9b;border-color:#70404a}
.section-title{font-size:14px;font-weight:800}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.info{background:#0a1725;border:1px solid #203449;border-radius:11px;padding:10px}.info strong{display:block;margin-top:5px;font-size:14px}
button{cursor:pointer;transition:filter .15s,transform .15s}button:active{transform:scale(.985)}button:disabled{cursor:not-allowed}
@media(max-width:400px){.wrap{padding:11px}.stage{height:285px}.mult{top:70px}.status{top:138px}.brand{font-size:21px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><div class="brand">✈️ <em>AVIATOR</em></div><div class="muted">Telegram Web App · ETB</div></div>
    <div style="text-align:right"><div class="muted">ዋና ዋሌት</div><div id="balance" class="balance">— ETB</div><div class="pill" style="margin-top:6px">● የተገናኘ ዋሌት</div></div>
  </div>
  <div id="stage" class="stage">
    <div class="crash-flash"></div>
    <div class="clouds"></div>
    <div class="stage-top"><span class="live"><i class="dot"></i> LIVE ROUND</span><span class="pill" id="roundLabel">ROUND LIVE</span></div>
    <div id="mult" class="mult">1.00x</div>
    <div id="status" class="status">ግንኙነት በመጠበቅ ላይ…</div>
    <div class="flight">
      <svg class="flightline" id="lineSvg" viewBox="0 0 100 100" preserveAspectRatio="none">
        <path id="curvePath" d="M 0 100 Q 0 100 0 100" fill="rgba(255, 67, 95, 0.2)" stroke="#ff435f" stroke-width="2"/>
      </svg>
      <div id="planeWrap"><span id="plane">✈️</span></div>
    </div>
  </div>
  <div class="panel">
    <div class="row"><b>ውርርድ አስገባ</b><span class="muted">Min 1 · Max 10,000 ETB</span></div>
    <input id="amount" type="number" min="1" max="10000" step="0.01" value="10" inputmode="decimal" aria-label="ውርርድ መጠን">
    <div class="quick"><button data-a="10">10 ETB</button><button data-a="50">50 ETB</button><button data-a="100">100 ETB</button><button data-a="500">500 ETB</button></div>
    <button id="bet" class="primary">✦ ውርርድ አስገባ</button>
    <button id="cash" class="primary cash" disabled>⚡ CASH OUT</button>
    <div class="info-grid"><div class="info"><span class="muted">የእኔ ውርርድ</span><strong id="myStake">— ETB</strong></div><div class="info"><span class="muted">ሊቀበሉት የሚችሉት</span><strong id="potential">— ETB</strong></div></div>
    <div id="msg" class="msg" role="status"></div>
  </div>
  <div class="panel"><div class="row"><span class="section-title">የቀደሙ ዙሮች</span><span class="muted">Recent results</span></div><div id="history" class="hist"><span class="muted">ውጤቶች በመጫን ላይ…</span></div></div>
</div>
<script>
'use strict';
const tg=window.Telegram?.WebApp;
tg?.ready();tg?.expand();
const initData=tg?.initData||'';
const $=id=>document.getElementById(id);
let phase='',lastPhase='',myBet=null,lastRoundId=null,lastMult=1,refreshBusy=false;

function money(n){return Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function note(t,bad=false){$('msg').style.display='block';$('msg').textContent=t;$('msg').style.border=bad?'1px solid #ff4c69':'1px solid #24d18b'}
function clearNote(){$('msg').style.display='none'}

async function api(path,body){
  const r=await fetch('/api/aviator/'+path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json','X-Telegram-Init-Data':initData},body:body?JSON.stringify(body):undefined,cache:'no-store'});
  let d;try{d=await r.json()}catch{throw Error('Server ምላሽ አልተረዳም።')}
  if(!r.ok||!d.success)throw Error(d.error||'ጥያቄው አልተሳካም።');
  return d;
}

/* ከታች (Bottom-Left) ተነስቶ ወደ ላይ (Top-Right) የሚሄድ አኒሜሽን */
function animatePlane(mult){
  const m = Math.max(1, Number(mult)||1);
  // Logarithmic progression for smooth curve takeover
  const progress = Math.min(1, Math.log(m) / Math.log(15));
  
  // X: 0% -> 75% (ከግራ ወደ ቀኝ)
  // Y: 0% -> 70% (ከታች ወደ ላይ)
  const xPx = progress * ($('stage').offsetWidth * 0.72);
  const yPx = progress * ($('stage').offsetHeight * 0.65);
  const angle = Math.min(35, progress * 28); // አንግሉ እየጨመረ ወደ ላይ ያዘነብላል

  if(phase === 'crashed'){
    $('plane').textContent = '💥';
    $('planeWrap').style.transform = `translate(${xPx}px, -${yPx}px) scale(1.2) rotate(45deg)`;
  } else {
    $('plane').textContent = '✈️';
    $('planeWrap').style.transform = `translate(${xPx}px, -${yPx}px) rotate(-${angle}deg)`;
  }

  // የቀይ ከፍታ መስመር (Curve SVG Path Update)
  const pathX = progress * 100;
  const pathY = 100 - (progress * 70);
  const controlX = pathX * 0.5;
  $('curvePath').setAttribute('d', `M 0 100 Q ${controlX} 100 ${pathX} ${pathY} L ${pathX} 100 Z`);
}

function render(d){
  $('balance').textContent=money(d.balance)+' ETB';
  const round=d.round||{};
  phase = round.phase || '';

  if (phase === 'crashed' && lastPhase !== 'crashed') {
    $('stage').classList.remove('crashed');
    void $('stage').offsetWidth;
    $('stage').classList.add('crashed');
  }

  lastPhase = phase;
  myBet=d.myBet||null;
  const mult=Number(round.multiplier||1);
  $('mult').textContent=mult.toFixed(2)+'x';
  $('mult').className='mult'+(phase==='flying'?' flying':phase==='crashed'?' crashed':'');$('stage').className='stage'+(phase==='flying'?' flying':phase==='crashed'?' crashed':'');
  $('roundLabel').textContent=phase==='betting'?'NEXT ROUND':phase==='flying'?'ROUND LIVE':phase==='crashed'?'CRASHED':'CONNECTING';$('status').textContent=phase==='betting'?'ውርርድ ይቀበላል':phase==='flying'?'አውሮፕላኑ እየበረረ ነው':'ዙሩ አልቋል';
  animatePlane(mult);
  $('bet').disabled=!(phase==='betting'&&!myBet);
  $('cash').disabled=!(phase==='flying'&&myBet&&myBet.status==='ACTIVE');$('myStake').textContent=myBet?money(myBet.amount)+' ETB':'— ETB';
  $('potential').textContent=myBet?.status==='ACTIVE'?money(Number(myBet.amount)*mult)+' ETB':myBet?.status==='CASHED_OUT'?money(myBet.payout)+' ETB':'— ETB';
  const hist=round.history||[];
  $('history').innerHTML=hist.length?hist.map(x=>{const v=Number(x.multiplier)||1;return `<span class="chip ${v>=10?'high':v>=2?'mid':'low'}">${v.toFixed(2)}x</span>`}).join(''):'<span class="muted">ገና የቀደመ ውጤት የለም።</span>';
  if(myBet?.status==='CASHED_OUT')note(`Cash Out ${Number(myBet.multiplier||mult).toFixed(2)}x · ${money(myBet.payout)} ETB`);
  if(myBet?.status==='LOST')note('ዙሩ ተቋርጧል፤ ይህ ውርርድ ተሸንፏል።',true);
}

async function refresh(){
  if(refreshBusy)return;
  if(!initData){$('status').textContent='ይህን ገጽ ከTelegram Bot ውስጥ ይክፈቱ።';$('bet').disabled=true;$('cash').disabled=true;return}
  refreshBusy=true;
  try{const d=await api('state');render(d)}catch(e){$('status').textContent='Server ግንኙነት በመጠበቅ ላይ';note(e.message,true)}finally{refreshBusy=false}
}

document.querySelectorAll('[data-a]').forEach(b=>b.addEventListener('click',()=>{$('amount').value=b.dataset.a}));$('bet').addEventListener('click',async()=>{
  const amount=Number($('amount').value);
  if(!Number.isFinite(amount)||amount<1||amount>10000){note('ከ1 እስከ 10,000 ETB ያለ መጠን ያስገቡ።',true);return}
  $('bet').disabled=true;clearNote();
  try{const d=await api('bet',{amount});note(d.message||'ውርርድ ተቀብሏል።');await refresh()}
  catch(e){note(e.message,true);await refresh()}
});
$('cash').addEventListener('click',async()=>{$('cash').disabled=true;clearNote();
  try{const d=await api('cashout',{});note(`Cash Out ${Number(d.multiplier||1).toFixed(2)}x · ${money(d.payout)} ETB`);await refresh()}
  catch(e){note(e.message,true);await refresh()}
});
refresh();setInterval(refresh,500);
</script>
</body>
</html>
