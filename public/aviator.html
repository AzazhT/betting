<!doctype html><html lang="am"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Aviator</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>:root{color-scheme:dark;--bg:#09131f;--card:#111f30;--green:#24d18b;--red:#ff4c69;--muted:#9aadc1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f7fb;font-family:Arial,sans-serif}.wrap{max-width:620px;margin:auto;padding:16px}.top,.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:22px;font-weight:900}.muted{color:var(--muted);font-size:13px}.balance{font-size:20px;font-weight:900;color:var(--green)}.stage{overflow:hidden;background:radial-gradient(ellipse at 50% 100%,#153b4a,#07101b 65%);height:260px;border:1px solid #243b50;border-radius:18px;margin-top:14px;display:flex;align-items:center;justify-content:center;flex-direction:column}.mult{font-size:52px;font-weight:900}.plane{font-size:50px}.panel{background:var(--card);border-radius:15px;padding:13px;margin-top:14px}input,button{font:inherit;border-radius:11px;padding:13px;border:0}input{background:#07101b;color:white;width:100%;border:1px solid #30475c;margin:12px 0}.quick{display:flex;gap:8px}.quick button{flex:1;background:#263a50;color:white}.primary{width:100%;background:var(--green);color:#04140e;margin-top:10px;font-weight:800}.cash{background:#ffce57;color:#231800}.primary:disabled{opacity:.45}.msg{padding:10px;border-radius:10px;margin-top:10px;background:#213448;display:none}.hist{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.chip{padding:7px 10px;border-radius:20px;background:#203348;font-size:12px}.note{font-size:12px;line-height:1.5;color:var(--muted);margin-top:14px}</style></head><body><div class="wrap"><div class="top"><div><div class="brand">✈️ Aviator</div><div class="muted">Telegram Web App · ETB</div></div><div style="text-align:right"><div class="muted">ዋና ዋሌት</div><div id="balance" class="balance">— ETB</div></div></div><div class="stage"><div id="mult" class="mult">1.00x</div><div id="plane" class="plane">✈️</div><div id="status" class="muted">በመጫን ላይ…</div></div><div class="panel"><div class="row"><b>ውርርድ (ETB)</b><span class="muted">Min 1 · Max 10,000</span></div><input id="amount" type="number" min="1" max="10000" step="0.01" value="10"><div class="quick"><button data-a="10">10 ETB</button><button data-a="50">50 ETB</button><button data-a="100">100 ETB</button></div><button id="bet" class="primary">ውርርድ አስገባ</button><button id="cash" class="primary cash" disabled>Cash Out</button><div id="msg" class="msg"></div></div><div class="panel"><b>የቀደሙ ዙሮች</b><div id="history" class="hist"></div></div><div class="note">እውነተኛ የዋሌት ብር ይጠቀማል። ውርርድ ሲገባ ገንዘብ ይቀነሳል፤ Cash Out በተሳካ ጊዜ ክፍያው ወደ ዋሌት ይመለሳል። ኪሳራ ሊኖር ይችላል።</div></div><script>const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const initData=tg?.initData||'';const $=x=>document.getElementById(x);let phase='',myBet=null;function money(n){return Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}function note(t,bad=false){$('msg').style.display='block';$('msg').textContent=t;$('msg').style.border=bad?'1px solid #ff4c69':'1px solid #24d18b'}async function api(path,body){const r=await fetch('/api/aviator/'+path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json','X-Telegram-Init-Data':initData},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'ስህተት');return d}async function refresh(){try{if(!initData){$('status').textContent='በTelegram Web App ውስጥ ይክፈቱ።';return}const d=await api('state');$('balance').textContent=money(d.balance)+' ETB';phase=d.round.phase;myBet=d.myBet;$('mult').textContent=Number(d.round.multiplier||1).toFixed(2)+'x';$('status').textContent=phase==='betting'?'ውርርድ ይቀበላል':phase==='flying'?'አውሮፕላኑ እየበረረ ነው':'ዙሩ አልቋል';$('plane').style.transform=phase==='flying'?'translate(35px,-35px)':'translate(0,0)';$('history').innerHTML=(d.round.history||[]).map(x=>`<span class="chip">${Number(x.multiplier).toFixed(2)}x</span>`).join('');$('bet').disabled=!(phase==='betting'&&!myBet);$('cash').disabled=!(phase==='flying'&&myBet&&myBet.status==='ACTIVE');if(myBet?.status==='CASHED_OUT')note(`Cash Out ${myBet.multiplier}x · ${money(myBet.payout)} ETB`)}catch(e){note(e.message,true)}}document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>$('amount').value=b.dataset.a);$('bet').onclick=async()=>{try{const d=await api('bet',{amount:Number($('amount').value)});note(d.message||'ውርርድ ተቀብሏል።');await refresh()}catch(e){note(e.message,true)}};$('cash').onclick=async()=>{try{const d=await api('cashout',{});note(`Cash Out ${d.multiplier}x · ${money(d.payout)} ETB`);await refresh()}catch(e){note(e.message,true)}};refresh();setInterval(refresh,500);</script></body></html>
