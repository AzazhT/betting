
<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a120e">
  <title>Fast Keno - እድል ኬኖ</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/keno.css">

  <style>
    .number:disabled { opacity: .55; cursor: not-allowed; }
    .bet-btn:disabled { opacity: .6; cursor: not-allowed; }
    .number.selected { outline: 2px solid var(--gold, #f5c542); }
    .number.winning, .pick.matched { background: #16834a; color: white; }
    .current { place-items: center; }
    .drawn { display: flex; flex-wrap: wrap; gap: 7px; }
    .ball {
      display: grid;
      place-items: center;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      font-weight: 800;
      background: #174f35;
      color: white;
    }
    .ball.active { outline: 2px solid var(--gold, #f5c542); }
    .notice { display: none; }
    .notice.show { display: block; }
    .notice.error { background: #7f1d1d; color: #fff; }
  </style>
</head>

<body>
  <main class="app">
    <header class="topbar">
      <a href="/" class="brand">
        <div class="logo">K</div>
        <div>
          <strong>FAST KENO</strong>
          <small>Ethio Lottery Style</small>
        </div>
      </a>
      <a href="/" class="home">↩️ መመለሻ</a>
    </header>

    <section class="wallet">
      <div>
        <small id="playerInfo">PLAYER · Loading...</small>
        <small style="color:var(--gold);font-weight:800">የዋናው ዋሌት ቀሪ ሂሳብ</small>
        <strong class="wallet-balance">0.00 ETB</strong>
      </div>
    </section>

    <section class="card">
      <div class="head">
        <h2 id="gameTitle">ቁጥሮችዎን ይምረጡ</h2>
        <div class="timer-badge" id="roundTimerBadge">60ሰ</div>
      </div>

      <div class="draw-area">
        <div class="muted" id="drawPlaceholder">ከ1–80 እስከ 10 ቁጥሮች ይምረጡ</div>
        <div class="current" id="currentBall" style="display:none;"></div>
        <div class="drawn" id="drawnBalls"></div>
        <small id="drawCounter" class="muted"></small>
      </div>

      <div id="bettingControlsSection">
        <div class="head">
          <h2>ቁጥር መምረጫ</h2>
          <span class="pill"><span id="selectedCount">0</span> / 10</span>
        </div>

        <div class="grid" id="numberGrid"></div>

        <div class="stake-row flex" style="display:flex;align-items:center;justify-content:space-between;">
          <span class="stake-label">ውርርድ (Stake)</span>
          <div class="stake-control">
            <button type="button" id="minus">−</button>
            <strong id="stakeAmount">10.00 ETB</strong>
            <button type="button" id="plus">＋</button>
          </div>
          <button type="button" class="quick" id="double">×2</button>
          <button type="button" class="quick" id="max">MAX</button>
        </div>

        <button type="button" class="bet-btn" id="betButton">BET · 10.00 ETB</button>
      </div>
    </section>

    <nav class="tabs">
      <button type="button" class="tab active" data-tab="ACTIVE">
        የእርስዎ ቲኬቶች (<span id="activePlayerCount">0</span>)
      </button>
      <button type="button" class="tab" data-tab="HISTORY">ታሪክ</button>
      <button type="button" class="tab" data-tab="RESULTS">ውጤቶች</button>
    </nav>

    <section class="card">
      <div class="head">
        <h2 id="listTitle">የእርስዎ ቲኬቶች (Active)</h2>
        <span class="pill" id="listCount">0</span>
      </div>
      <div id="ticketList">
        <div class="empty">ቲኬቶች እየተጫኑ ነው...</div>
      </div>
    </section>
  </main>

  <div class="notice" id="notice" role="status" aria-live="polite"></div>

  <nav class="bottom-nav">
    <a href="/" class="nav-item">
      <span class="nav-icon">🏠</span>
      <span>Home</span>
    </a>
    <a href="/keno.html" class="nav-item active">
      <span class="nav-icon">🎯</span>
      <span>Game</span>
    </a>
    <a href="/wallet.html" class="deposit-pill">
      <span>+ Deposit</span>
    </a>
    <a href="/profile.html" class="nav-item">
      <span class="nav-icon">👤</span>
      <span>Profile</span>
    </a>
  </nav>

  <script>
  /* Fast Keno frontend */
  (() => {
    'use strict';

    const API = {
      user: '/api/wallet/sync',
      status: '/api/keno/status',
      play: '/api/keno/play',
      tickets: '/api/keno/tickets',
      results: '/api/keno/results'
    };

    const MIN_STAKE = 10;
    const MAX_STAKE = 1000;
    const STEP = 10;
    const MAX_PICKS = 10;

    const $ = selector => document.querySelector(selector);
    const tg = window.Telegram?.WebApp;

    const state = {
      identifier: String(tg?.initDataUnsafe?.user?.id ?? ''),
      name: 'Player',
      balance: 0,
      picks: new Set(),
      stake: MIN_STAKE,
      round: null,
      myTickets: [],
      drawingRound: null,
      activeTab: 'ACTIVE',
      draw: []
    };

    const el = {
      grid: $('#numberGrid'),
      timerBadge: $('#roundTimerBadge'),
      title: $('#gameTitle'),
      count: $('#selectedCount'),
      stake: $('#stakeAmount'),
      bet: $('#betButton'),
      balance: $('.wallet-balance'),
      player: $('#playerInfo'),
      notice: $('#notice'),
      placeholder: $('#drawPlaceholder'),
      current: $('#currentBall'),
      controls: $('#bettingControlsSection'),
      drawn: $('#drawnBalls'),
      counter: $('#drawCounter'),
      list: $('#ticketList'),
      listTitle: $('#listTitle'),
      listCount: $('#listCount'),
      activePlayers: $('#activePlayerCount')
    };

    let noticeTimer;
    let pollBusy = false;
    let drawingBusy = false;

    function money(value) {
      const number = Number(value);
      return `${(Number.isFinite(number) ? number : 0).toFixed(2)} ETB`;
    }

    function updateBalance(value) {
      const number = Number(value);
      if (!Number.isFinite(number) || number < 0) return;
      state.balance = number;
      el.balance.textContent = money(number);
      updateBetButton();
    }

    function notice(message, error = false) {
      el.notice.textContent = message;
      el.notice.classList.toggle('error', error);
      el.notice.classList.add('show');
      clearTimeout(noticeTimer);
      noticeTimer = setTimeout(() => el.notice.classList.remove('show'), 3000);
    }

    async function request(url, options = {}) {
      const response = await fetch(url, {
        ...options,
        headers: {
          ...(options.body ? { 'Content-Type': 'application/json' } : {}),
          ...(options.headers || {})
        }
      });

      const raw = await response.text();
      let data;

      try {
        data = raw ? JSON.parse(raw) : {};
      } catch {
        throw new Error(`የserver ምላሹ ትክክለኛ JSON አይደለም።`);
      }

      if (!response.ok || data.success === false) {
        throw new Error(data.error || data.message || `HTTP ${response.status}`);
      }

      return data;
    }

    async function loadUser() {
      if (tg) {
        tg.ready();
        tg.expand();
      }

      const user = tg?.initDataUnsafe?.user;

      if (!user?.id) {
        el.player.textContent = 'PLAYER · Telegram required';
        notice('እባክዎ Kenoን ከTelegram Web App ይክፈቱ።', true);
        return;
      }

      try {
        const data = await request(API.user, {
          method: 'POST',
          body: JSON.stringify({
            telegram_id: String(user.id),
            name: [user.first_name, user.last_name].filter(Boolean).join(' ') || 'Keno Player',
            username: user.username || ''
          })
        });

        if (!data.user) throw new Error('የተጠቃሚ መረጃ አልተገኘም።');

        state.identifier = String(data.user.telegram_id ?? user.id);
        state.name = data.user.name || user.first_name || 'Player';
        el.player.textContent = `PLAYER · ${state.name}`;

        if (data.user.balance !== undefined) {
          updateBalance(data.user.balance);
        } else {
          await refreshWallet();
        }
      } catch (error) {
        console.error('Keno user load:', error);
        notice(error.message || 'የተጠቃሚ መረጃ ማግኘት አልተቻለም።', true);
      }
    }

    async function refreshWallet() {
      if (!state.identifier) return;

      try {
        const data = await request(API.user, {
          method: 'POST',
          body: JSON.stringify({ telegram_id: state.identifier })
        });

        if (data.user?.balance !== undefined) updateBalance(data.user.balance);
      } catch (error) {
        console.warn('Wallet refresh:', error.message);
      }
    }

    function buildGrid() {
      el.grid.replaceChildren();

      for (let number = 1; number <= 80; number++) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'number';
        button.textContent = String(number);
        button.dataset.number = String(number);
        button.addEventListener('click', () => togglePick(number));
        el.grid.appendChild(button);
      }

      syncGrid();
    }

    function togglePick(number) {
      if (state.round?.status !== 'BETTING') return;

      if (state.picks.has(number)) {
        state.picks.delete(number);
      } else {
        if (state.picks.size >= MAX_PICKS) {
          notice('እስከ 10 ቁጥሮች ብቻ መምረጥ ይችላሉ።', true);
          return;
        }
        state.picks.add(number);
      }

      syncGrid();
    }

    function syncGrid() {
      el.grid.querySelectorAll('.number').forEach(button => {
        const number = Number(button.dataset.number);
        button.classList.toggle('selected', state.picks.has(number));
        button.classList.toggle('winning', state.draw.includes(number));
        button.disabled = state.round?.status !== 'BETTING';
      });
      el.count.textContent = String(state.picks.size);
    }

    function setStake(value) {
      if (state.round && state.round.status !== 'BETTING') return;

      let amount = Math.floor(Number(value) / STEP) * STEP;
      if (!Number.isFinite(amount)) amount = MIN_STAKE;

      state.stake = Math.min(MAX_STAKE, Math.max(MIN_STAKE, amount));
      el.stake.textContent = money(state.stake);
      updateBetButton();
    }

    function updateBetButton() {
      const open = state.round?.status === 'BETTING';
      el.bet.textContent = open ? `BET · ${money(state.stake)}` : 'ውጤቱን በመጠበቅ ላይ';
      el.bet.disabled = !open || !state.identifier;
    }

    async function placeBet() {
      if (!state.identifier) return notice('የTelegram መለያ አልተገኘም።', true);
      if (state.round?.status !== 'BETTING') return notice('የውርርድ ጊዜው ተዘግቷል።', true);
      if (!state.picks.size) return notice('ቢያንስ 1 ቁጥር ይምረጡ።', true);
      if (state.stake > state.balance) return notice('በዋሌትዎ በቂ ብር የለም።', true);

      el.bet.disabled = true;

      try {
        const data = await request(API.play, {
          method: 'POST',
          body: JSON.stringify({
            identifier: state.identifier,
            picks: [...state.picks].sort((a, b) => a - b),
            stake: state.stake
          })
        });

        if (!data.ticket) throw new Error('Server የቲኬት መረጃ አልመለሰም።');

        state.myTickets.unshift(data.ticket);

        if (data.balance !== undefined) updateBalance(data.balance);
        else await refreshWallet();

        state.picks.clear();
        syncGrid();
        renderTabContent();
        notice('ቲኬትዎ ተመዝግቧል!');
      } catch (error) {
        notice(error.message || 'ቲኬት መመዝገብ አልተቻለም።', true);
        await refreshStatus();
      } finally {
        updateBetButton();
      }
    }

    function makePicks(values, draw = []) {
      const box = document.createElement('div');
      box.className = 'picks';

      (Array.isArray(values) ? values : []).forEach(number => {
        const item = document.createElement('span');
        item.className = 'pick' + (draw.includes(Number(number)) ? ' matched' : '');
        item.textContent = String(number).padStart(2, '0');
        box.appendChild(item);
      });

      return box;
    }

    function renderTabContent() {
      if (state.activeTab !== 'ACTIVE') return loadOtherTabs();

      el.list.replaceChildren();
      el.listTitle.textContent = 'የእርስዎ ቲኬቶች (Active)';
      el.listCount.textContent = String(state.myTickets.length);

      if (!state.myTickets.length) {
        el.list.innerHTML = '<div class="empty">በዚህ ዙር ቲኬት አልተመዘገበም።</div>';
        return;
      }

      state.myTickets.forEach((ticket, index) => {
        const row = document.createElement('div');
        row.className = 'item';

        const top = document.createElement('div');
        top.className = 'itemtop';

        const label = document.createElement('span');
        label.textContent = `⭐ ቲኬት #${index + 1}`;

        const status = document.createElement('span');
        status.className = ticket.status === 'WON' ? 'won' :
          ticket.status === 'LOST' ? 'lost' : 'waiting';
        status.textContent = ticket.status === 'WON' ? 'አሸንፈዋል' :
          ticket.status === 'LOST' ? 'አልተሳካም' : 'በመጠበቅ ላይ';

        top.append(label, status);

        const bottom = document.createElement('div');
        bottom.className = 'itembottom';
        bottom.textContent = `ውርርድ ${money(ticket.stake)} · ክፍያ ${money(ticket.payout)}`;

        row.append(top, makePicks(ticket.picks, state.draw), bottom);
        el.list.appendChild(row);
      });
    }

    async function loadOtherTabs() {
      try {
        el.list.replaceChildren();

        if (state.activeTab === 'HISTORY') {
          el.listTitle.textContent = 'የውርርድ ታሪክ';

          if (!state.identifier) {
            el.list.textContent = 'ከTelegram ይክፈቱ።';
            return;
          }

          const data = await request(
            `${API.tickets}?identifier=${encodeURIComponent(state.identifier)}`
          );
          renderItems(data.tickets || [], 'HISTORY');
        } else if (state.activeTab === 'RESULTS') {
          el.listTitle.textContent = 'የቅርብ ውጤቶች';
          const data = await request(API.results);
          renderItems(data.results || [], 'RESULTS');
        }
      } catch (error) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = error.message;
        el.list.replaceChildren(empty);
      }
    }

    function renderItems(items, type) {
      el.list.replaceChildren();
      el.listCount.textContent = String(items.length);

      if (!items.length) {
        el.list.innerHTML = '<div class="empty">ምንም መረጃ የለም።</div>';
        return;
      }

      items.forEach(item => {
        const row = document.createElement('div');
        row.className = 'item';

        const top = document.createElement('div');
        top.className = 'itemtop';

        const label = document.createElement('span');
        label.textContent = type === 'RESULTS'
          ? `ዙር #${item.roundId}`
          : `ዙር #${item.roundId} · ${item.createdAt ? new Date(item.createdAt).toLocaleString() : ''}`;

        const status = document.createElement('span');
        status.className = item.status === 'WON' ? 'won' :
          item.status === 'LOST' ? 'lost' : 'waiting';
        status.textContent = type === 'RESULTS'
          ? (item.status === 'CLOSED' ? 'ተዘግቷል' : 'ውጤት')
          : (item.status === 'WON' ? 'አሸንፈዋል' :
            item.status === 'LOST' ? 'አልተሳካም' : 'በመጠበቅ ላይ');

        top.append(label, status);

        const draw = Array.isArray(item.draw) ? item.draw : [];
        row.append(top, makePicks(type === 'RESULTS' ? draw : item.picks,
          type === 'RESULTS' ? [] : draw));

        if (type !== 'RESULTS') {
          const bottom = document.createElement('div');
          bottom.className = 'itembottom';
          bottom.textContent = `ውርርድ ${money(item.stake)} · ክፍያ ${money(item.payout)}`;
          row.appendChild(bottom);
        }

        el.list.appendChild(row);
      });
    }

    async function animateDraw(draw, roundId) {
      if (!Array.isArray(draw) || !draw.length ||
          state.drawingRound === roundId || drawingBusy) return;

      state.drawingRound = roundId;
      drawingBusy = true;
      state.draw = [];
      el.placeholder.style.display = 'none';
      el.current.style.display = 'grid';
      el.controls.style.display = 'none';
      el.title.textContent = 'የKeno ውጤት በመውጣት ላይ...';

      try {
        for (let index = 0; index < draw.length; index++) {
          state.draw.push(Number(draw[index]));
          el.current.textContent = String(draw[index]);

          el.counter.textContent = `ቁጥር ${index + 1} ከ ${draw.length}`;

          const ball = document.createElement('span');
          ball.className = 'ball active';
          ball.textContent = String(draw[index]);
          el.drawn.appendChild(ball);

          syncGrid();
          renderTabContent();

          if (index < draw.length - 1) {
            await new Promise(resolve => setTimeout(resolve, 700));
          }
        }

        el.title.textContent = 'የዙሩ ውጤት ተጠናቋል';

        if (state.identifier) {
          const data = await request(
            `${API.tickets}?identifier=${encodeURIComponent(state.identifier)}`
          );
          if (Array.isArray(data.tickets)) {
            state.myTickets = data.tickets.filter(
              ticket => String(ticket.roundId) === String(roundId)
            );
            renderTabContent();
          }
          await refreshWallet();
        }
      } catch (error) {
        console.error('Keno draw:', error);
      } finally {
        drawingBusy = false;
      }
    }

    async function refreshStatus() {
      if (pollBusy) return;
      pollBusy = true;

      try {
        const data = await request(API.status);
        const round = data.round;
        if (!round) return;

        const oldRoundId = state.round?.roundId;
        state.round = round;

        if (round.status === 'BETTING') {
          if (String(oldRoundId) !== String(round.roundId)) {
            state.picks.clear();
            state.myTickets = [];
            state.draw = [];
            state.drawingRound = null;

            el.current.textContent = '';
            el.current.style.display = 'none';
            el.controls.style.display = 'block';
            el.drawn.replaceChildren();
            el.counter.textContent = '';
            el.placeholder.style.display = 'block';
            el.title.textContent = 'ቁጥሮችዎን ይምረጡ';
          }

          el.timerBadge.textContent = `${Number(round.timeLeft ?? 60)}ሰ`;
        } else if (round.status === 'DRAWING') {
          el.timerBadge.textContent = 'ውጤት';
          if (!drawingBusy) await animateDraw(round.draw, round.roundId);
        } else {
          el.timerBadge.textContent = 'ጨርሷል';
        }

        syncGrid();
        updateBetButton();

        if (state.activeTab === 'ACTIVE' && !drawingBusy) {
          renderTabContent();
        }
      } catch (error) {
        console.error('Keno status:', error);
      } finally {
        pollBusy = false;
      }
    }

    function bind() {
      el.bet.addEventListener('click', placeBet);
      $('#minus').addEventListener('click', () => setStake(state.stake - STEP));
      $('#plus').addEventListener('click', () => setStake(state.stake + STEP));
      $('#double').addEventListener('click', () => setStake(state.stake * 2));
      $('#max').addEventListener('click', () =>
        setStake(Math.min(MAX_STAKE, Math.floor(state.balance / STEP) * STEP))
      );

      document.querySelectorAll('.tab').forEach(button => {
        button.addEventListener('click', async () => {
          document.querySelectorAll('.tab').forEach(tab =>
            tab.classList.toggle('active', tab === button)
          );
          state.activeTab = button.dataset.tab;
          await renderTabContent();
        });
      });
    }

    async function init() {
      buildGrid();
      bind();
      setStake(MIN_STAKE);
      await loadUser();
      await refreshStatus();
      await renderTabContent();

      setInterval(refreshStatus, 1000);
      setInterval(refreshWallet, 15000);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init, { once: true });
    } else {
      init();
    }
  })();
  </script>
</body>
</html>
