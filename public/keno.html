<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a120e"><title>Fast Keno - እድል ኬኖ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/keno.css"></head>
<body><main class="app">
<header class="topbar"><a href="/" class="brand"><div class="logo">K</div><div><strong>FAST KENO</strong><small>Ethio Lottery Style</small></div></a><a href="/" class="home">↩️ መመለሻ</a></header>
<section class="wallet">
  <div>
    <small id="playerInfo">PLAYER · Loading...</small>
    <small style="color:var(--gold);font-weight:800">የዋናው ዋሌት ቀሪ ሂሳብ</small>
    <strong class="wallet-balance">0.00 ETB</strong>
  </div>
</section>

<section class="card">
  <div class="head">
    <h2 id="gameTitle">ቁጥሮችዎን ይምረጡ</h2>
    <div class="timer-badge" id="roundTimerBadge">60ሰ</div>
  </div>
  
  <div class="draw-area">
    <div class="muted" id="drawPlaceholder">ከ1–80 እስከ 10 ቁጥሮች ይምረጡ</div>
    <div class="current" id="currentBall" style="display:none;"></div>
    <div class="drawn" id="drawnBalls"></div>
    <small id="drawCounter" class="muted"></small>
  </div>

  <!-- ቁጥር መምረጫ እና ውርርድ ክፍል (በውጤት ሰዓት ሙሉ በሙሉ ይዘጋል/ይተካል) -->
  <div id="bettingControlsSection">
    <div class="head"><h2>ቁጥር መምረጫ</h2><span class="pill"><span id="selectedCount">0</span> / 10</span></div>
    <div class="grid" id="numberGrid"></div>
<div class="stake-row flex" style="display:flex;align-items:center;justify-content:space-between;">
      <span class="stake-label">ውርርድ (Stake)</span>
      <div class="stake-control"><button type="button" id="minus">−</button><strong id="stakeAmount">10.00 ETB</strong><button type="button" id="plus">＋</button></div>
      <button type="button" class="quick" id="double">×2</button><button type="button" class="quick" id="max">MAX</button>
    </div>
    <button type="button" class="bet-btn" id="betButton">BET · 10.00 ETB</button>
  </div>
</section>

<!-- ታቦች -->
<nav class="tabs">
  <button type="button" class="tab active" data-tab="ACTIVE">Active Players (<span id="activePlayerCount">180</span>)</button>
  <button type="button" class="tab" data-tab="HISTORY">ታሪክ</button>
  <button type="button" class="tab" data-tab="RESULTS">ውጤቶች</button>
</nav>

<section class="card"><div class="head"><h2 id="listTitle">የእርስዎ ቲኬቶች እና ተጫዋቾች (Active)</h2><span class="pill" id="listCount">0</span></div><div id="ticketList"><div class="empty">ቲኬቶች እየተጫኑ ነው...</div></div></section></main><div class="notice" id="notice" role="status" aria-live="polite"></div>

<!-- Fixed Bottom Navigation Bar -->
<nav class="bottom-nav">
  <a href="/" class="nav-item">
    <span class="nav-icon">🏠</span>
    <span>Home</span>
  </a>
  <a href="/keno.html" class="nav-item active">
    <span class="nav-icon">🎯</span>
    <span>Game</span>
  </a>
  <a href="#" class="deposit-pill">
    <span>+ Deposit</span>
  </a>
  <a href="#" class="nav-item">
    <span class="nav-icon">👤</span>
    <span>Profile</span>
  </a>
</nav>

<script src="/keno.js" defer></script></body></html>
