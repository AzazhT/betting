<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a120e"><title>Fast Keno - እድል ኬኖ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0a120e;--panel:#121e17;--panel2:#1a2a21;--muted:#819e8f;--text:#f2f7f4;--gold:#f3bc3d;--gold-light:#ffe6a0;--gold-dark:#c19220;--green:#20d68b;--green-glow:#00ff88;--red:#ff5c5c;--line:#223b2e}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,var(--panel),var(--bg));color:var(--text);font:12px/1.3 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:6px 10px 80px 10px;overflow-x:hidden}
.app{width:min(100%,480px);margin:auto}
.topbar,.wallet,.head,.stake-row{display:flex;align-items:center;justify-content:space-between;gap:6px}
.topbar{margin-bottom:7px;align-items:center}.brand{display:flex;align-items:center;gap:6px;color:var(--text);text-decoration:none;min-width:0}.top-wallet{margin-left:auto;text-align:right;background:linear-gradient(135deg,#17281e,#0e1913);border:1px solid #294534;border-radius:10px;padding:5px 8px;min-width:130px;max-width:58%;display:flex;flex-direction:column;gap:1px}.top-wallet strong{font-size:14px;line-height:1.2;color:var(--gold);white-space:nowrap}.top-wallet small{font-size:8px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:#171203;font-weight:900;box-shadow:0 3px 10px rgba(243,188,61,0.3)}
.brand strong{font-size:12px}.brand small,.wallet small{color:var(--muted);font-size:9px}
.home{color:var(--gold);text-decoration:none;font-weight:800;background:var(--panel2);border:1px solid var(--line);padding:4px 8px;border-radius:6px;font-size:10px}

/* ክብ የዙር ቆጣሪ — በቀድሞው የዋሌት ቦታ */
.timer-wallet{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;margin:0 auto 7px;padding:5px 0;color:var(--muted);font-size:9px}
.timer-circle{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--green) 0deg,#183627 300deg);border:2px solid var(--green);box-shadow:0 0 15px rgba(32,214,139,.22);position:relative}
.timer-circle::before{content:"";position:absolute;inset:4px;border-radius:50%;background:#0e1c14;border:1px solid #294534}
.timer-circle #roundTimerBadge{position:relative;z-index:1;color:var(--green-glow);font-size:15px;font-weight:900}

/* ካርድ እና ሄደር ከ አረንጓዴ ሰዓት ቆጣሪ ጋር */
.card{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 10px;margin-bottom:6px;box-shadow:0 4px 15px rgba(0,0,0,0.5)}
.head{margin-bottom:6px}.head h2{margin:0;font-size:13px;color:var(--gold-light)}
.timer-badge{background:#0e1c14;border:1px solid var(--green);color:var(--green-glow);padding:3px 8px;border-radius:12px;font-size:11px;font-weight:900;box-shadow:0 0 8px rgba(32,214,139,0.3)}

/* የቁጥር መውጫ እና አኒሜሽን አካባቢ */
.draw-area{min-height:90px;border-radius:10px;background:radial-gradient(ellipse at center,#1a3023,#0e1812 70%,#0a120e);border:1px solid #2c4a37;padding:6px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;margin-bottom:6px;position:relative;overflow:hidden}
.current{font-size:24px;color:#0a120e;background:linear-gradient(135deg,#7affc2,var(--green));width:45px;height:45px;border-radius:50%;display:grid;place-items:center;font-weight:900;box-shadow:0 0 20px var(--green-glow);animation:pulseBall .6s ease infinite alternate}
@keyframes pulseBall{0%{transform:scale(1);box-shadow:0 0 10px var(--green-glow)}100%{transform:scale(1.08);box-shadow:0 0 22px var(--green-glow)}}

.drawn{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;width:100%;max-height:75px;overflow-y:auto}
.ball{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:9px;font-weight:800;background:#14241b;border:1px solid #2c4c39;color:#b2d4c3}
.ball.active{background:linear-gradient(135deg,#7affc2,var(--green));color:#0a120e;border-color:#35f59c;box-shadow:0 0 10px var(--green-glow)}

.muted{color:var(--muted);font-size:10px}

/* Compact reward information */
.payout-preview {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 6px;
  margin: 0 0 6px;
  padding: 0 2px;
  background: transparent;
  border: 0;
  box-shadow: none;
  color: var(--gold-light);
  font-size: 10px;
  font-weight: 800;
  line-height: 1.5;
}

.payout-preview > span:first-child {
  flex-shrink: 0;
  color: var(--gold);
}

#previewDetails {
  flex: 1;
  min-width: 0;
  text-align: right;
  color: var(--green-glow);
  overflow-wrap: anywhere;
}

/* 1-80 ቁጥሮች እንደ ኳስ */
.grid {
  display: grid;
  grid-template-columns: repeat(10, minmax(0, 1fr));
  gap: 5px;
  margin: 5px 0 8px;
}

.number {
  aspect-ratio: 1;
  min-width: 0;
  padding: 0;
  border-radius: 50%;
  border: 1px solid #355641;
  color: #d8f5e3;
  background: radial-gradient(
    circle at 30% 25%,
    #294a35,
    #14251a 70%
  );
  box-shadow:
    inset 0 1px 2px rgba(255,255,255,.08),
    0 2px 4px rgba(0,0,0,.25);
  font-size: clamp(9px, 2.8vw, 12px);
  font-weight: 800;
  cursor: pointer;
  transition: transform .12s, box-shadow .12s;
}

.number:active {
  transform: scale(.92);
}

.number.selected {
  color: #211800;
  background: radial-gradient(
    circle at 30% 25%,
    #fff0b3,
    #f3bc3d 65%,
    #c19220
  );
  border-color: #ffe6a0;
  box-shadow: 0 0 10px rgba(243,188,61,.55);
  font-weight: 900;
}

.number.winning {
  color: #06291b;
  background: radial-gradient(
    circle at 30% 25%,
    #a3ffd2,
    #20d68b 70%
  );
  border-color: #7affc2;
  box-shadow: 0 0 10px rgba(0,255,136,.55);
}

.number.selected.winning {
  color: #06291b;
  background: radial-gradient(circle, #a3ffd2, #20d68b);
  border-color: #fff;
}

.number:disabled {
  cursor: not-allowed;
  opacity: .75;
}

.stake-row{margin-bottom:6px}
.stake-label{color:var(--muted);font-size:11px}
.stake-control{display:flex;align-items:center;gap:4px;background:var(--panel2);border-radius:7px;padding:3px;border:1px solid var(--line)}
.stake-control button,.quick{border:0;color:var(--text);background:#1f3528;border-radius:5px;padding:4px 7px;cursor:pointer;font-weight:700;font-size:10px}
.stake-control strong{min-width:50px;text-align:center;color:var(--gold);font-size:11px;font-weight:900}
.quick{color:var(--gold);font-weight:800}
.bet-btn{width:100%;padding:10px;font-size:13px;font-weight:900}

/* ታቦች */
.tabs{display:flex;gap:3px;padding:3px;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
.tab{flex:1;border:0;border-radius:7px;padding:7px 2px;color:var(--muted);background:transparent;font-size:10px;font-weight:800;cursor:pointer;text-align:center}
.tab.active{color:#171203;background:var(--gold);box-shadow:0 3px 10px rgba(243,188,61,0.3)}

.item{background:#0e1913;border:1px solid var(--line);border-radius:8px;padding:7px 8px;margin-bottom:4px;display:flex;flex-direction:column;gap:4px}
.itemtop,.itembottom{display:flex;justify-content:space-between;align-items:center;gap:4px;font-size:10px}
.picks{display:flex;gap:3px;flex-wrap:wrap}
.pick{width:20px;height:20px;border-radius:4px;background:#15261d;display:grid;place-items:center;font-size:9px;font-weight:800;color:var(--gold);border:1px solid #294a37}
.matched{background:var(--green);color:#fff;border-color:#35f59c}
.waiting{color:var(--gold);font-weight:800}
.won{color:var(--green);font-weight:800}
.lost{color:var(--red);font-weight:800}
.empty{text-align:center;padding:10px 0;color:var(--muted)}
.notice{position:fixed;left:50%;bottom:75px;transform:translateX(-50%);width:max-content;max-width:90vw;background:#ffe6a0;color:#171203;border-radius:8px;padding:8px 12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:1000;font-weight:800;text-align:center;box-shadow:0 5px 20px rgba(0,0,0,0.5)}
.notice.show{opacity:1}.notice.error{background:var(--red);color:#fff}

/* Fixed Bottom Navigation Bar */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(10,29,25,0.95);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:8px 16px;display:flex;align-items:center;justify-content:space-around;gap:8px;z-index:1000}
.nav-item{display:flex;flex-direction:column;align-items:center;color:var(--muted);text-decoration:none;font-size:10px;gap:3px;transition:color 0.2s}
.nav-item:hover,.nav-item.active{color:var(--green)}
.nav-icon{font-size:16px}
.deposit-pill{background:var(--green);color:#05251a;padding:6px 14px;border-radius:18px;font-weight:900;font-size:12px;text-decoration:none;display:flex;align-items:center;gap:4px;box-shadow:0 4px 15px rgba(32,214,139,0.3)}
@media(max-width:360px){.brand strong{font-size:11px}.brand small{font-size:8px}.top-wallet{min-width:112px;padding:4px 6px}.top-wallet strong{font-size:12px}.logo{width:27px;height:27px}}
</style></head>
<body><main class="app">
<header class="topbar">
  <a href="/" class="brand"><div class="logo">K</div><div><strong>FAST KENO</strong><small>Ethio Lottery Style</small></div></a>
  <section class="top-wallet" aria-label="Wallet balance">
    <small>WALLET BALANCE</small>
    <strong class="wallet-balance">0.00 ETB</strong>
    <small id="playerInfo">PLAYER · Loading...</small>
  </section>
</header>
<section class="timer-wallet" aria-label="Round countdown">
  <div class="timer-circle"><span id="roundTimerBadge">60ሰ</span></div>
  <small>ቀጣይ ዙር</small>
</section>

<section class="card">
  <div class="head">
    <h2 id="gameTitle">ቁጥሮችዎን ይምረጡ</h2>
  </div>
  
  <div class="draw-area">
    <div class="muted" id="drawPlaceholder">ከ1–80 እስከ 10 ቁጥሮች ይምረጡ</div>
    <div class="current" id="currentBall" style="display:none;"></div>
    <div class="drawn" id="drawnBalls"></div>
    <small id="drawCounter" class="muted"></small>
  </div>

  <!-- ቁጥር መምረጫ እና ውርርድ ክፍል (በውጤት ሰዓት ሙሉ በሙሉ ይዘጋል/ይተካል) -->
  <div id="bettingControlsSection">
    <div class="head">
      <h2>1–80 ቁጥሮች ይምረጡ</h2>
      <span class="pill"><span id="selectedCount">0</span> / 10</span>
    </div>

    <div class="payout-preview" id="payoutPreview">
      <span>🏆 የሚያገኙት ሽልማት</span>
      <span id="previewDetails" style="color:#7affc2;font-weight:900;">ቁጥሮችን ይምረጡ</span>
    </div>

    <div class="grid" id="numberGrid"></div>

    <div class="stake-row flex" style="display:flex;align-items:center;justify-content:space-between;">
      <span class="stake-label">ውርርድ (Stake)</span>
      <div class="stake-control"><button id="minus">−</button><strong id="stakeAmount">10.00 ETB</strong><button id="plus">＋</button></div>
      <button class="quick" id="double">×2</button><button class="quick" id="max">MAX</button>
    </div>
    <button class="bet-btn" id="betButton">BET · 10.00 ETB</button>
  </div>
</section>

<!-- ታቦች -->
<nav class="tabs">
  <button class="tab active" data-tab="ACTIVE">Active Players (<span id="activePlayerCount">180</span>)</button>
  <button class="tab" data-tab="HISTORY">ታሪክ</button>
  <button class="tab" data-tab="RESULTS">ውጤቶች</button>
</nav>

<section class="card"><div class="head"><h2 id="listTitle">የእርስዎ ቲኬቶች እና ተጫዋቾች (Active)</h2><span class="pill" id="listCount">0</span></div><div id="ticketList"><div class="empty">ቲኬቶች እየተጫኑ ነው...</div></div></section></main><div class="notice" id="notice" role="status" aria-live="polite"></div>

<!-- Fixed Bottom Navigation Bar -->
<nav class="bottom-nav">
  <a href="/" class="nav-item">
    <span class="nav-icon">🏠</span>
    <span>Home</span>
  </a>
  <a href="/keno.html" class="nav-item active">
    <span class="nav-icon">🎯</span>
    <span>Game</span>
  </a>
  <a href="#" class="deposit-pill">
    <span>+ Deposit</span>
  </a>
  <a href="#" class="nav-item">
    <span class="nav-icon">👤</span>
    <span>Profile</span>
  </a>
</nav>

<script>
(() => {
'use strict';
const API={user:'/api/get-user',wallet:'/api/keno/bonus',status:'/api/keno/status',play:'/api/keno/play',tickets:'/api/keno/tickets',results:'/api/keno/results'};
const MIN_STAKE=10,MAX_STAKE=1000,STEP=10,MAX_PICKS=10;

const PAYTABLE = {
  1: {1: 3.8},
  2: {2: 15},
  3: {2: 2, 3: 30},
  4: {2: 1, 3: 6, 4: 100},
  5: {3: 3, 4: 15, 5: 400},
  6: {3: 1, 4: 6, 5: 50, 6: 1200},
  7: {4: 3, 5: 15, 6: 150, 7: 3000},
  8: {4: 2, 5: 10, 6: 60, 7: 600, 8: 8000},
  9: {5: 5, 6: 30, 7: 250, 8: 2000, 9: 12000},
  10: {5: 2, 6: 12, 7: 80, 8: 600, 9: 3000, 10: 20000}
};

const $=s=>document.querySelector(s);
const tg=window.Telegram?.WebApp;
const state={identifier:String(tg?.initDataUnsafe?.user?.id??''),name:'Player',balance:0,picks:new Set(),stake:MIN_STAKE,round:null,myTickets:[],fakeBets:[],drawingRound:null,activeTab:'ACTIVE',draw:[],activePlayerCount:180};
const el={grid:$('#numberGrid'),timerBadge:$('#roundTimerBadge'),title:$('#gameTitle'),count:$('#selectedCount'),stake:$('#stakeAmount'),bet:$('#betButton'),balance:$('.wallet-balance'),player:$('#playerInfo'),notice:$('#notice'),placeholder:$('#drawPlaceholder'),current:$('#currentBall'),controls:$('#bettingControlsSection'),drawn:$('#drawnBalls'),counter:$('#drawCounter'),list:$('#ticketList'),listTitle:$('#listTitle'),listCount:$('#listCount'),activePlayers:$('#activePlayerCount'),preview:$('#payoutPreview'),previewDetails:$('#previewDetails')};
let noticeTimer=null,pollBusy=false,activeInterval=null;

function playClickSound(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(650, ctx.currentTime);
    gain.gain.setValueAtTime(0.04, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.07);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.07);
  }catch(e){}
}

function money(v){const n=Number(v);return `${(Number.isFinite(n)?n:0).toFixed(2)} ETB`;}
function updateBalance(v){const n=Number(v);if(!Number.isFinite(n)||n<0)throw new Error('የዋናው ዋሌት ባላንስ ትክክል አይደለም።');state.balance=n;el.balance.textContent=money(n);}
function notice(message,error=false){el.notice.textContent=message;el.notice.classList.toggle('error',error);el.notice.classList.add('show');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>el.notice.classList.remove('show'),3000);}
async function request(url,options={}){const response=await fetch(url,{...options,headers:{...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})}});const data=await response.json().catch(()=>({}));if(!response.ok||data.success===false)throw new Error(data.error||`Request failed (${response.status})`);return data;}

async function loadUser(){if(tg){tg.ready();tg.expand();}const tgUser=tg?.initDataUnsafe?.user;if(!tgUser?.id){notice('እባክዎ Kenoን ከTelegram Web App ይክፈቱ።',true);return;}
try{const data=await request(API.user,{method:'POST',body:JSON.stringify({identifier:String(tgUser.id),name:tgUser.first_name||'Keno Player',username:tgUser.username||'keno_user'})});if(data.user){const id=data.user.telegram_id??tgUser.id;state.identifier=String(id);state.name=data.user.name||tgUser.first_name||'Player';el.player.textContent=`PLAYER · ${state.name}`;}else{state.identifier=String(tgUser.id);el.player.textContent=`PLAYER · ${state.name}`;}await refreshWallet();}
catch(err){console.error('Keno user load:',err);notice(err.message||'የተጠቃሚ መረጃ ማግኘት አልተቻለም።',true);}}

async function refreshWallet(){if(!state.identifier)return;const data=await request(`${API.wallet}?identifier=${encodeURIComponent(state.identifier)}`);if(data.balance===undefined||data.balance===null)throw new Error('የዋሌት API የbalance መረጃ አልላከም።');updateBalance(data.balance);}

function buildGrid(){el.grid.replaceChildren();for(let n=1;n<=80;n++){const b=document.createElement('button');b.type='button';b.className='number';b.textContent=String(n);b.dataset.number=String(n);b.addEventListener('click',()=>{playClickSound();togglePick(n);});el.grid.appendChild(b);}syncGrid();}

function togglePick(n){if(!state.round||state.round.status!=='BETTING')return;if(state.picks.has(n))state.picks.delete(n);else{if(state.picks.size>=MAX_PICKS)return notice('እስከ 10 ቁጥሮች ብቻ መምረጥ ይችላሉ።',true);state.picks.add(n);}syncGrid();updatePayoutPreview();}

function updatePayoutPreview() {
  const count = state.picks.size;

  if (count === 0) {
    el.previewDetails.textContent = 'ቁጥሮችን ይምረጡ';
    return;
  }

  const table = PAYTABLE[count];

  if (!table) {
    el.previewDetails.textContent = 'ሽልማት አልተገኘም';
    return;
  }

  const tiers = Object.entries(table)
    .map(([matches, multiplier]) => ({
      matches: Number(matches),
      multiplier: Number(multiplier)
    }))
    .sort((a, b) => a.matches - b.matches);

  el.previewDetails.textContent = tiers
    .map(tier => {
      const payout = state.stake * tier.multiplier;

      return `${tier.matches} ቢመታ → ${money(payout)}`;
    })
    .join(' · ');
}

function syncGrid(){el.grid.querySelectorAll('.number').forEach(b=>{const n=Number(b.dataset.number);b.classList.toggle('selected',state.picks.has(n));b.classList.toggle('winning',state.draw.includes(n));b.disabled=!state.round||state.round.status!=='BETTING';});el.count.textContent=state.picks.size;}

function setStake(v){if(state.round&&state.round.status!=='BETTING')return;let n=Math.floor(Number(v)/STEP)*STEP;state.stake=Math.min(MAX_STAKE,Math.max(MIN_STAKE,Number.isFinite(n)?n:MIN_STAKE));el.stake.textContent=money(state.stake);updateBetButton();updatePayoutPreview();}

function updateBetButton(){if(!state.round||state.round.status!=='BETTING'){el.bet.textContent='ውጤቱን በመጠበቅ ላይ';el.bet.disabled=true;}else{el.bet.textContent=`BET · ${money(state.stake)}`;el.bet.disabled=false;}}

async function placeBet(){
  if(!state.identifier)return notice('የTelegram ተጠቃሚ መለያ አልተገኘም።',true);
  if(!state.round||state.round.status!=='BETTING')return notice('የውርርድ ጊዜው ተዘግቷል።',true);
  if(!state.picks.size)return notice('ቢያንስ 1 ቁጥር ይምረጡ።',true);
  if(state.stake>state.balance)return notice('በዋሌትዎ ውስጥ በቂ ብር የለም።',true);
  el.bet.disabled=true;
  playClickSound();
  try{
    const data=await request(API.play,{method:'POST',body:JSON.stringify({identifier:state.identifier,picks:[...state.picks].sort((a,b)=>a-b),stake:state.stake})});
    state.myTickets.push(data.ticket);
    updateBalance(data.balance);
    state.picks.clear();
    syncGrid();
    updateBetButton();
    updatePayoutPreview();
    renderTabContent();
    notice('ቲኬትዎ ተመዝግቧል!');
  }catch(err){
    notice(err.message||'ቲኬት መመዝገብ አልተቻለም።',true);
    await refreshStatus();
  }finally{updateBetButton();}
}

function generateFakeBets(timeLeft){
  if(state.fakeBets.length >= 20 || !timeLeft) return;
  const stakes = [1000, 700, 800, 665, 500, 470, 400, 350, 200, 150, 100, 50];
  const stake = stakes[Math.floor(Math.random() * stakes.length)];
  const pickCount = Math.floor(Math.random() * 8) + 2;
  const picks = [];
  while(picks.length < pickCount){
    const r = Math.floor(Math.random() * 80) + 1;
    if(!picks.includes(r)) picks.push(r);
  }
  picks.sort((a,b)=>a-b);
  state.fakeBets.push({id: 'FK-' + Math.floor(Math.random()*8999+1000), name: 'Player ' + Math.floor(Math.random()*900+100), stake: stake, picks: picks});
  state.fakeBets.sort((a,b) => b.stake - a.stake);
}

function makePicks(values,draw=[]){const box=document.createElement('div');box.className='picks';(values||[]).forEach(n=>{const b=document.createElement('span');b.className='pick'+(draw.includes(n)?' matched':'');b.textContent=String(n).padStart(2,'0');box.appendChild(b);});return box;}

function renderTabContent(){
  el.list.replaceChildren();
  
  if(state.activeTab === 'ACTIVE'){
    el.listTitle.textContent = 'የእርስዎ ቲኬቶች እና የቀጥታ ተጫዋቾች (Active)';
    
    let allItems = [];
    state.myTickets.forEach((t, idx) => {
      allItems.push({isMine: true, ticket: t, index: idx+1});
    });
    state.fakeBets.forEach((t, idx) => {
      allItems.push({isMine: false, ticket: t, index: idx+1});
    });

    el.listCount.textContent = String(allItems.length);
    if(!allItems.length){
      el.list.innerHTML='<div class="empty">በዚህ ዙር የተያዙ ቲኬቶች እየተጫኑ ነው...</div>';
      return;
    }

    allItems.forEach((item) => {
      const row=document.createElement('div');row.className='item';
      const top=document.createElement('div');top.className='itemtop';
      const a=document.createElement('span');
      
      const t = item.ticket;
      let matchedCount = (t.picks||[]).filter(p => state.draw.includes(p)).length;
      let mult = (PAYTABLE[t.picks?.length] && PAYTABLE[t.picks?.length][matchedCount]) || 0;
      let payout = (t.stake || 10) * mult;
      const isDrawingOrClosed = state.draw.length > 0;

      const s=document.createElement('span');

      if(item.isMine){
        a.innerHTML = `⭐ <b>የእርስዎ ቲኬት #${item.index}</b>`;
        if(!isDrawingOrClosed){
          s.className = 'waiting';
          s.textContent = 'በመጠበቅ ላይ...';
        } else if(payout > 0){
          s.className = 'won';
          s.textContent = `አሸንፈዋል! +${money(payout)}`;
        } else {
          s.className = 'lost';
          s.textContent = 'አልተሳካም (0.00 ETB)';
        }
      } else {
        a.innerHTML = `🏆 <b>TOP · ${t.name}</b>`;
        if(!isDrawingOrClosed){
          s.className = 'waiting';
          s.textContent = 'በመጠበቅ ላይ';
        } else if(payout > 0){
          s.className = 'won';
          s.textContent = `አሸነፈ: +${money(payout)}`;
        } else {
          s.className = 'lost';
          s.textContent = 'አልተሳካም';
        }
      }

      top.append(a,s);
      const bottom=document.createElement('div');bottom.className='itembottom';
      bottom.textContent = `ውርርድ ${money(t.stake)} ${isDrawingOrClosed ? '· መታ: ' + matchedCount + ' ቁጥር' : ''}`;
      row.append(top,makePicks(t.picks,state.draw),bottom);
      el.list.append(row);
    });
    return;
  }

  loadOtherTabs();
}

async function loadOtherTabs(){
  try{
    if(state.activeTab==='HISTORY'){
      el.listTitle.textContent='የውርርድ ታሪክ';
      const data=await request(`${API.tickets}?identifier=${encodeURIComponent(state.identifier)}`);
      renderItems(data.tickets||[],'HISTORY');
    }else if(state.activeTab==='RESULTS'){
      el.listTitle.textContent='የቅርብ ውጤቶች';
      const data=await request(API.results);
      renderItems(data.results||[],'RESULTS');
    }
  }catch(err){el.list.innerHTML='';const d=document.createElement('div');d.className='empty';d.textContent=err.message;el.list.append(d);}
}

function renderItems(items,type){el.list.replaceChildren();el.listCount.textContent=String(items.length);if(!items.length){el.list.innerHTML='<div class="empty">ምንም መረጃ የለም።</div>';return;}items.forEach(item=>{const row=document.createElement('div');row.className='item';const top=document.createElement('div');top.className='itemtop';const label=document.createElement('span');label.textContent=type==='RESULTS'?`ዙር #${item.roundId}`:`ዙር #${item.roundId} · ${new Date(item.createdAt).toLocaleString()}`;const status=document.createElement('span');status.className=item.status==='WON'?'won':item.status==='LOST'?'lost':'waiting';status.textContent=type==='RESULTS'?(item.status==='CLOSED'?'ተዘግቷል':'ውጤት'):(item.status==='WON'?'አሸንፈዋል':item.status==='LOST'?'አልተሳካም':'በመጠበቅ ላይ');top.append(label,status);row.append(top,makePicks(type==='RESULTS'?item.draw:item.picks,type==='RESULTS'?[]:(item.draw||[])));if(type!=='RESULTS'){const bottom=document.createElement('div');bottom.className='itembottom';bottom.textContent=`ውርርድ ${money(item.stake)} · ክፍያ ${money(item.payout)}`;row.append(bottom);}el.list.append(row);});}

async function animateDraw(draw,roundId){
  if(!Array.isArray(draw)||!draw.length||state.drawingRound===roundId)return;
  state.drawingRound=roundId;
  state.draw=[];
  el.placeholder.style.display='none';
  el.current.style.display='grid';
  el.controls.style.display='none'; // ቁጥር መምረጫው ሙሉ በሙሉ ይጠፋል እና ቦታውን የድሮው ኳስ መውጫ ይይዛል
  el.title.textContent='ቀጥታ የKeno ውጤት በመውጣት ላይ...';
  
  for(let i=0;i<draw.length;i++){
    state.draw.push(Number(draw[i]));
    el.current.textContent=String(draw[i]);
    el.counter.textContent=`ቁጥር ${i+1} ከ ${draw.length}`;
    const ball=document.createElement('span');
    ball.className='ball active';
    ball.textContent=String(draw[i]);
    el.drawn.append(ball);
    syncGrid();
    renderTabContent();
    if(i<draw.length-1)await new Promise(resolve=>setTimeout(resolve,700));
  }
  el.title.textContent='የዙሩ ውጤት ተጠናቀቀ';
  if(state.myTickets.length)await refreshMyTicket().catch(()=>{});
}

async function refreshMyTicket(){const data=await request(`${API.tickets}?identifier=${encodeURIComponent(state.identifier)}`);if(data.tickets) { state.myTickets = data.tickets.filter(t => String(t.roundId) === String(state.round?.roundId)); renderTabContent(); } await refreshWallet();}

async function refreshStatus(){
  if(pollBusy)return;pollBusy=true;
  try{
    const data=await request(API.status);
    const round=data.round;
    if(!round)return;
    const old=state.round?.roundId;
    state.round=round;
    
    if(round.status==='BETTING'){
      generateFakeBets(round.timeLeft);
      if(old!==round.roundId){
        state.picks.clear();
        state.myTickets=[];
        state.fakeBets=[];
        state.draw=[];
        state.drawingRound=null;
        el.current.textContent='';
        el.current.style.display='none';
        el.controls.style.display='block'; // ቁጥር መምረጫው ተመልሶ ይመጣል
        el.drawn.replaceChildren();
        el.counter.textContent='';
        el.placeholder.style.display='block';
        el.title.textContent='ቁጥሮችዎን ይምረጡ';
        updatePayoutPreview();
      }
      el.timerBadge.textContent=`${round.timeLeft}ሰ`;
    }else if(round.status==='DRAWING'){
      el.timerBadge.textContent=`ውጤት`;
      await animateDraw(round.draw,round.roundId);
    }else el.timerBadge.textContent='ጨርሷል';
    
    syncGrid();
    updateBetButton();
    renderTabContent();
  }catch(err){console.error('Keno status:',err);el.timerBadge.textContent='Error';}finally{pollBusy=false;}
}

function bind(){
  el.bet.addEventListener('click',placeBet);
  $('#minus').addEventListener('click',()=>setStake(state.stake-STEP));
  $('#plus').addEventListener('click',()=>setStake(state.stake+STEP));
  $('#double').addEventListener('click',()=>setStake(state.stake*2));
  $('#max').addEventListener('click',()=>setStake(Math.min(MAX_STAKE,Math.floor(state.balance/STEP)*STEP)));

  document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',async()=>{
    document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b===btn));
    state.activeTab=btn.dataset.tab;
    await renderTabContent();
  }));
}

async function init(){
  buildGrid();
  bind();
  setStake(MIN_STAKE);
  await loadUser();
  await refreshStatus();
  await renderTabContent();
  
  activeInterval = setInterval(() => {
    state.activePlayerCount += Math.floor(Math.random() * 35) + 10;
    if(state.activePlayerCount > 2800) state.activePlayerCount = 450;
    el.activePlayers.textContent = state.activePlayerCount;
  }, 2000);

  setInterval(refreshStatus,1000);
  setInterval(()=>{refreshWallet().catch(err=>console.warn('Wallet refresh:',err.message));},10000);
}

if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
})();
</script></body></html>
