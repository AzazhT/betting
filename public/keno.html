<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#10120f" />
  <title>Fast Keno - እድል ኬኖ</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg: #10120f;
      --panel: #1b1e19;
      --panel-2: #242821;
      --muted: #92988d;
      --text: #f7f8f4;
      --gold: #e6b947;
      --green: #6ea54e;
      --line: #30352c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding-bottom: 70px;
    }

    button { font: inherit; }

    .app {
      width: min(100%, 480px);
      margin: auto;
      padding: 14px 14px calc(24px + env(safe-area-inset-bottom));
    }

    .topbar, .wallet, .section-head, .stake-row, .tabs {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .topbar { margin-bottom: 14px; }

    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); }
    .logo {
      width: 38px; height: 38px; border-radius: 12px;
      display: grid; place-items: center;
      background: var(--gold); color: #17150e; font-weight: 900;
    }
    .brand strong { display: block; font-size: 15px; }
    .brand small { color: var(--muted); font-size: 11px; }

    .wallet {
      background: linear-gradient(115deg, #252a20, #1a1d18);
      border: 1px solid #34392f; border-radius: 16px;
      padding: 13px 15px; margin-bottom: 14px;
    }
    .wallet small { color: var(--muted); display: block; }
    .wallet strong { font-size: 20px; color: var(--gold); }
    .wallet .add {
      border: 0; border-radius: 10px; padding: 9px 13px;
      background: var(--gold); font-weight: 800; color: #1a170e; cursor: pointer;
    }

    .game-card, .tickets-card {
      border: 1px solid var(--line); background: var(--panel);
      border-radius: 17px; padding: 14px; margin-bottom: 14px;
    }

    .section-head { margin-bottom: 12px; }
    .section-head h2 { margin: 0; font-size: 16px; }
    .pill {
      border-radius: 20px; padding: 5px 9px;
      background: #292e25; color: var(--gold); font-size: 11px; font-weight: 700;
    }

    .draw-area {
      position: relative;
      min-height: 140px; border-radius: 14px;
      background: radial-gradient(ellipse at center, #263022 0%, #171c15 70%, #10120f 100%);
      border: 1px solid #343a2e; padding: 12px;
      display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px;
      margin-bottom: 14px; overflow: hidden;
    }

    .draw-counter {
      position: absolute; top: 10px; right: 14px;
      color: var(--gold); font-size: 12px; font-weight: 800;
    }

    .current-ball-container {
      display: flex; justify-content: center; align-items: center; min-height: 50px;
    }

    .draw-ball-large {
      width: 48px; height: 48px; border-radius: 50%;
      display: grid; place-items: center; color: #17150e;
      font-weight: 900; font-size: 16px;
      background: radial-gradient(circle at 30% 25%, #fff1ab, #e6b947 62%, #aa7720);
      box-shadow: 0 4px 18px #e6b94777;
      animation: pop .3s ease-out both;
    }

    .drawn-balls-row {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; max-width: 100%;
    }

    .small-ball {
      width: 28px; height: 28px; border-radius: 50%;
      display: grid; place-items: center; color: #fff;
      font-weight: 700; font-size: 11px;
      background: #252c20; border: 1px solid #3d4734;
    }
    .small-ball.active {
      background: radial-gradient(circle at 30% 25%, #fff1ab, #e6b947 62%, #aa7720);
      color: #17150e; font-weight: 900;
    }

    @keyframes pop {
      from { transform: scale(.2) translateY(-10px); opacity: 0; }
      to { transform: scale(1) translateY(0); opacity: 1; }
    }

    .empty-draw { text-align: center; color: var(--muted); }
    .empty-draw b { color: var(--gold); display: block; font-size: 16px; margin-bottom: 2px; }

    .grid {
      display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px;
      margin: 12px 0 14px;
    }
    .number {
      aspect-ratio: 1; border-radius: 9px; border: 1px solid #363b32;
      color: #d6d9d1; background: #252922; font-weight: 700;
      cursor: pointer; padding: 0; font-size: 13px;
    }
    .number.selected {
      color: #17150e; background: var(--gold); border-color: #f2ce6e;
      box-shadow: 0 0 10px #e6b94744;
    }
    .number.winning {
      color: #fff; background: var(--green); border-color: #a5d480;
    }

    .stake-row { gap: 8px; margin-bottom: 12px; display: flex; align-items: center; }
    .stake-label { color: var(--muted); margin-right: auto; }
    .stake-control {
      display: flex; align-items: center; gap: 7px;
      background: var(--panel-2); border-radius: 11px; padding: 5px;
    }
    .stake-control button, .quick-btn {
      border: 0; color: var(--text); background: #34392f;
      border-radius: 8px; padding: 7px 10px; cursor: pointer;
    }
    .stake-control strong { min-width: 48px; text-align: center; color: var(--gold); }
    .quick-btn { color: var(--gold); font-weight: 800; }

    .bet-btn {
      width: 100%; border: 0; border-radius: 12px; padding: 14px;
      color: #1b170b; background: var(--gold); font-weight: 900;
      letter-spacing: .08em; cursor: pointer;
    }
    .bet-btn:disabled { opacity: .55; cursor: not-allowed; }

    .ticket-item {
      background: #151814; border: 1px solid #2b3028; border-radius: 10px;
      padding: 10px 12px; margin-bottom: 8px; display: flex; flex-direction: column; gap: 6px;
    }
    .ticket-top { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); }
    .ticket-picks { display: flex; gap: 5px; flex-wrap: wrap; }
    
    .pick-ball {
      width: 26px; height: 26px; border-radius: 6px; background: #2a3026;
      display: grid; place-items: center; font-size: 11px; font-weight: 800; color: var(--gold);
      border: 1px solid #3b4233;
    }
    .pick-ball.matched {
      background: var(--green) !important; color: #fff !important; border-color: #8ce264 !important;
    }

    .ticket-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
    .ticket-stake { font-weight: 800; font-size: 13px; color: var(--text); }
    .status { font-weight: 800; font-size: 11px; }
    .status.waiting { color: var(--gold); }
    .status.won { color: var(--green); }
    .status.lost { color: #e5484d; }
    .empty-list { padding: 16px 0; text-align: center; color: var(--muted); }

    .notice {
      position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
      background: #f4f1e7; color: #1b1d18; border-radius: 10px;
      padding: 10px 14px; box-shadow: 0 6px 25px #0008;
      opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 1000;
      font-weight: 700;
    }
    .notice.show { opacity: 1; }
    .notice.error { background: #e5484d; color: #fff; }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <a href="/" class="brand">
        <div class="logo">K</div>
        <div><strong>FAST KENO</strong><small>Ethio Lottery Style</small></div>
      </a>
      <a href="/" style="color: var(--gold); text-decoration: none; font-weight: 800; font-size: 12px;">🏠 መነሻ</a>
    </header>

    <section class="wallet">
      <div><small id="playerInfo">PLAYER · Loading...</small><strong class="wallet-balance">0.00 ETB</strong></div>
      <button class="add" id="addFunds">＋ ዋሌት</button>
    </section>

    <section class="game-card">
      <div class="section-head">
        <h2 id="gameTitle">ቁጥሮችዎን ይምረጡ</h2>
        <span class="pill" id="roundTimer">ዙር: 30ሰ</span>
      </div>

      <div class="draw-area" id="drawArea">
        <div class="draw-counter" id="drawCounter"></div>
        <div class="empty-draw" id="drawPlaceholder">
          <b>Fast Keno</b><span>እስከ 10 ቁጥሮች ይምረጡ</span>
        </div>
        <div class="current-ball-container" id="currentBallContainer"></div>
        <div class="drawn-balls-row" id="drawnBallsRow"></div>
      </div>

      <div class="section-head">
        <h2>ቁጥር መምረጫ</h2>
        <span class="pill"><span id="selectedCount">0</span> / 10 ተመርጠዋል</span>
      </div>
      <div class="grid" id="numberGrid"></div>

      <div class="stake-row">
        <span class="stake-label">ውርርድ (Stake)</span>
        <div class="stake-control">
          <button id="minus">−</button>
          <strong id="stakeAmount">10.00 ETB</strong>
          <button id="plus">＋</button>
        </div>
        <button class="quick-btn" id="double">×2</button>
        <button class="quick-btn" id="max">MAX</button>
      </div>

      <button class="bet-btn" id="betButton">ውርርድ መዝግብ (BET)</button>
    </section>

    <section class="tickets-card">
      <div class="section-head">
        <h2>የእርስዎ ቲኬቶች</h2>
        <span class="pill">ዙር: <span id="myTicketCount">0</span></span>
      </div>
      <div id="ticketList"><div class="empty-list">እስካሁን ቲክኬቶች የሉም</div></div>
    </section>
  </main>

  <div class="notice" id="notice"></div>

  <script>
    (() => {
      "use strict";

      const CONFIG = {
        playEndpoint: "/api/keno/play",
        maxPicks: 10,
        minStake: 10,
        stakeStep: 10,
        maxStake: 1000,
        currency: "ETB"
      };

      const socket = io();
      const $ = (selector, root = document) => root.querySelector(selector); const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];

      const elements = {
        grid: $("#numberGrid"),
        drawArea: $("#drawArea"),
        drawCounter: $("#drawCounter"),
        drawPlaceholder: $("#drawPlaceholder"),
        currentBallContainer: $("#currentBallContainer"),
        drawnBallsRow: $("#drawnBallsRow"),
        selectedCount: $("#selectedCount"),
        stakeAmount: $("#stakeAmount"),
        betButton: $("#betButton"),
        gameTitle: $("#gameTitle"),
        ticketList: $("#ticketList"),
        myTicketCount: $("#myTicketCount"),
        wallet: $(".wallet"),
        notice: $("#notice"),
        playerInfo: $("#playerInfo"),
        roundTimer: $("#roundTimer")
      };

      const state = {
        picks: new Set(),
        winningNumbers: [],
        stake: CONFIG.minStake,
        balance: 0.00,
        identifier: getIdentifier(),
        name: "Player",
        myTickets: [],
        isDrawing: false,
        hasPlacedBet: false
      };

      function getIdentifier() {
        const tg = window.Telegram?.WebApp;
        const telegramId = tg?.initDataUnsafe?.user?.id;
        if (telegramId != null) return String(telegramId);
        return localStorage.getItem("kenoUserId") || "123456789";
      }

      function formatMoney(value) {
        const amount = Number(value);
        if (!Number.isFinite(amount)) return "0.00 ETB";
        return `${amount.toFixed(2)} ${CONFIG.currency}`;
      }

      function showNotice(message, isError = false) {
        if (!elements.notice) return;
        elements.notice.textContent = message;
        elements.notice.classList.toggle("error", isError);
        elements.notice.classList.add("show");
        setTimeout(() => {
          elements.notice.classList.remove("show", "error");
        }, 2600);
      }

      async function loadUser() {
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }
        
        const userUnsafe = tg?.initDataUnsafe?.user;
        const bodyData = {
          identifier: state.identifier,
          name: userUnsafe?.first_name || "Keno Player",
          username: userUnsafe?.username || "keno_user"
        };

        try {
          const res = await fetch('/api/get-user', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(bodyData)
          });
          const data = await res.json();
          if (data.success && data.user) {
            state.balance = parseFloat(data.user.balance);
            state.identifier = String(data.user.identifier || data.user.telegram_id);
            state.name = data.user.name || "Player";
            updateWallet(state.balance);
            if (elements.playerInfo) elements.playerInfo.textContent = `PLAYER · ${state.name}`;
          }
        } catch (e) {
          console.error("User load error:", e);
        }
      }

      function updateWallet(balance) {
        state.balance = Number(balance);
        if (!elements.wallet) return;
        const amountEl = $(".wallet-balance", elements.wallet);
        if (amountEl) amountEl.textContent = formatMoney(state.balance);
      }

      // Socket.io Realtime Events
      socket.on('round_update', (data) => {
        if (data.status === 'BETTING') {
          if (elements.roundTimer) elements.roundTimer.textContent = `ውርርድ: ${data.timeLeft}ሰ`;
        } else if (data.status === 'DRAWING') {
          if (elements.roundTimer) elements.roundTimer.textContent = `ድራው: ${data.timeLeft}ሰ`;
        }
      });

      socket.on('draw_started', async (data) => {
        state.isDrawing = true;
        elements.betButton.disabled = true;
        elements.betButton.textContent = "ጨዋታ በሂደት ላይ...";

        await revealDraw(data.draw);
      });

      socket.on('round_reset', (data) => {
        state.isDrawing = false;
        state.hasPlacedBet = false;
        state.winningNumbers = [];
        state.myTickets = [];
        if (elements.currentBallContainer) elements.currentBallContainer.innerHTML = "";
        if (elements.drawCounter) elements.drawCounter.textContent = "";
        if (elements.drawPlaceholder) elements.drawPlaceholder.style.display = "block";
        if (elements.gameTitle) elements.gameTitle.textContent = "ቁጥሮችዎን ይምረጡ";
        elements.betButton.disabled = false;
        elements.betButton.textContent = `ውርርድ መዝግብ (BET)`;
        makeNumberGrid();
        renderTicketsList();
      });

      function makeNumberGrid() {
        if (!elements.grid) return;
        elements.grid.replaceChildren();
        for (let number = 1; number <= 80; number++) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "number";
          button.textContent = String(number);
          button.dataset.number = String(number);
          button.addEventListener("click", () => togglePick(number));
          elements.grid.appendChild(button);
        }
        syncGrid();
      }

      function togglePick(number) {
        if (state.isDrawing || state.hasPlacedBet) return;
        if (state.picks.has(number)) {
          state.picks.delete(number);
        } else {
          if (state.picks.size >= CONFIG.maxPicks) {
            showNotice(`እስከ 10 ቁጥሮች ብቻ መምረጥ ይችላሉ።`);
            return;
          }
          state.picks.add(number);
        }
        syncGrid();
      }

      function syncGrid() {
        if (!elements.grid) return;
        $$(".number", elements.grid).forEach(button => {
          const number = Number(button.dataset.number);
          const selected = state.picks.has(number);
          const matched = state.winningNumbers.includes(number) && selected;

          button.classList.toggle("selected", selected);
          button.classList.toggle("winning", matched);
        });

        if (elements.selectedCount) {
          elements.selectedCount.textContent = String(state.picks.size);
        }
      }

      function setStake(value) {
        if (state.isDrawing || state.hasPlacedBet) return;
        const amount = Math.floor(Number(value) || CONFIG.minStake);
        state.stake = Math.min(CONFIG.maxStake, Math.max(CONFIG.minStake, amount));

        if (elements.stakeAmount) elements.stakeAmount.textContent = formatMoney(state.stake);
      }

      function revealDraw(draw) {
        return new Promise(resolve => {
          state.winningNumbers = [];
          if (elements.drawPlaceholder) elements.drawPlaceholder.style.display = "none";
          if (elements.drawnBallsRow) elements.drawnBallsRow.innerHTML = "";
          if (elements.gameTitle) elements.gameTitle.textContent = "ቀጥታ ስርጭት (Live draw)";

          let index = 0;
          const drawTimer = setInterval(() => {
            const currentNum = draw[index];
            state.winningNumbers.push(currentNum);
            
            if (elements.currentBallContainer) {
              elements.currentBallContainer.innerHTML = `<div class="draw-ball-large">${currentNum}</div>`;
            }

            if (elements.drawCounter) {
              elements.drawCounter.textContent = `${index + 1} / 20`;
            }

            if (elements.drawnBallsRow) {
              const smallBall = document.createElement("div");
              smallBall.className = "small-ball active";
              smallBall.textContent = currentNum;
              elements.drawnBallsRow.appendChild(smallBall);
            }

            syncGrid();
            index++;

            if (index >= draw.length) {
              clearInterval(drawTimer);
              if (elements.gameTitle) elements.gameTitle.textContent = "ዙሩ ተጠናቋል";
              resolve();
            }
          }, 750); // በየ 750 ሚሊሰከንድ አንድ ኳስ (በአጠቃላይ ~15 ሰከንድ)
        });
      }

      async function placeBet() {
        if (state.isDrawing || state.hasPlacedBet) return;
        if (state.picks.size < 1) {
          showNotice("እባክዎ ቢያንስ 1 ቁጥር ይምረጡ።", true);
          return;
        }
        if (state.stake > state.balance) {
          showNotice("በዋሌትዎ ውስጥ በቂ ብር የለም።", true);
          return;
        }

        const picks = [...state.picks].sort((a, b) => a - b);

        try {
          const response = await fetch(CONFIG.playEndpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              picks: picks,
              stake: state.stake,
              identifier: state.identifier
            })
          });

          const data = await response.json();
          if (!response.ok || !data.success) throw new Error(data.error || "ስህተት ተፈጥሯል።");

          state.balance = data.balance;
          updateWallet(state.balance);
          state.hasPlacedBet = true;

          state.myTickets = [{
            picks: picks,
            stake: state.stake,
            status: "Waiting"
          }];
          renderTicketsList();

          showNotice("ውርርዱ በተሳካ ሁኔታ ተመዝግቧል!");
          elements.betButton.disabled = true;
          elements.betButton.textContent = "ተመዝግቧል (Waiting)";

        } catch (error) {
          console.error(error);
          showNotice(error.message || "ውርርድ መመዝገብ አልተቻለም", true);
        }
      }

      function renderTicketsList() {
        if (!elements.ticketList) return;
        if (state.myTickets.length === 0) {
          elements.ticketList.innerHTML = '<div class="empty-list">እስካሁን ቲክኬቶች የሉም</div>';
          if (elements.myTicketCount) elements.myTicketCount.textContent = "0";
          return;
        }

        if (elements.myTicketCount) elements.myTicketCount.textContent = "1";
        elements.ticketList.replaceChildren();

        state.myTickets.forEach(ticket => {
          const row = document.createElement("div");
          row.className = "ticket-item";

          const topDiv = document.createElement("div");
          topDiv.className = "ticket-top";
          topDiv.innerHTML = `<span>እርስዎ</span><span class="status waiting">Waiting</span>`;

          const picksDiv = document.createElement("div");
          picksDiv.className = "ticket-picks";
          ticket.picks.forEach(num => {
            const ball = document.createElement("div");
            ball.className = "pick-ball";
            if (state.winningNumbers.includes(num)) {
              ball.classList.add("matched");
            }
            ball.textContent = String(num).padStart(2, "0");
            picksDiv.appendChild(ball);
          });

          const bottomDiv = document.createElement("div");
          bottomDiv.className = "ticket-bottom";
          bottomDiv.innerHTML = `<span class="ticket-stake">Bet ${ticket.stake} ETB</span>`;

          row.append(topDiv, picksDiv, bottomDiv);
          elements.ticketList.appendChild(row);
        });
      }

      function bindControls() {
        elements.betButton?.addEventListener("click", placeBet);
        $("#minus")?.addEventListener("click", () => setStake(state.stake - CONFIG.stakeStep));
        $("#plus")?.addEventListener("click", () => setStake(state.stake + CONFIG.stakeStep));
        $("#double")?.addEventListener("click", () => setStake(state.stake * 2));
        $("#max")?.addEventListener("click", () => setStake(Math.min(CONFIG.maxStake, state.balance)));
        $("#addFunds")?.addEventListener("click", () => showNotice("እባክዎ ከዋሌት ክፍል ገቢ ያድርጉ።"));
      }

      function init() {
        makeNumberGrid();
        bindControls();
        setStake(state.stake);
        renderTicketsList();
        loadUser();
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init, { once: true });
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
