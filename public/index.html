<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ዕድል ሐሴት - ጨዋታዎች</title>
    <!-- Telegram Web App Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 420px;
        }
        .header {
            background: #1e293b;
            padding: 15px 20px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .user-info h2 { font-size: 18px; margin: 0; color: #38bdf8; }
        .balance-box { font-size: 14px; color: #94a3b8; margin-top: 4px; }
        .balance-box span { color: #facc15; font-weight: bold; }
        
        h1.title {
            font-size: 20px;
            color: #f8fafc;
            margin-bottom: 15px;
            text-align: center;
        }
        .games-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }
        .game-card {
            background: #1e293b;
            border-radius: 14px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #334155;
            text-decoration: none;
            color: white;
        }
        .game-card:hover {
            background: #334155;
            border-color: #38bdf8;
            transform: translateY(-2px);
        }
        .game-info h3 { margin: 0 0 5px 0; font-size: 18px; color: #38bdf8; }
        .game-info p { margin: 0; font-size: 13px; color: #94a3b8; }
        .game-icon {
            font-size: 32px;
            background: #0f172a;
            padding: 12px;
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- የ ከላይ ፕሬፋይል እና ባላንስ ማሳያ -->
        <div class="header">
            <div class="user-info">
                <h2 id="username">ተጫዋች</h2>
                <div class="balance-box">ባላንስ: <span id="user-balance">0.00</span> ብር</div>
            </div>
            <button onclick="depositModal()" style="background:#2563eb; color:white; border:none; padding:8px 14px; border-radius:8px; cursor:pointer; font-weight:bold;">+ ገንዘብ  ጨምር</button>
        </div>

        <h1 class="title">🎮 የሚወዷቸውን ጨዋታዎች ይምረጡ</h1>

        <!-- የጨዋታዎች ዝርዝር (Dashboard Menu) -->
        <div class="games-grid">
            <!-- 1. ቢንጎ -->
            <a href="/bingo.html" class="game-card">
                <div class="game-info">
                    <h3>ዕድል ሐሴት ቢንጎ</h3>
                    <p>ባለብዙ ተጫዋች የቁጥር ጨዋታ</p>
                </div>
                <div class="game-icon">🎲</div>
            </a>

            <!-- 2. ስፖርት ውርርድ -->
            <a href="/betting.html" class="game-card">
                <div class="game-info">
                    <h3>እግር ኳስ ውርርድ</h3>
                    <p>የዕለቱ ግጥሚያዎች እና ትንበያዎች</p>
                </div>
                <div class="game-icon">⚽</div>
            </a>

            <!-- 3. ገበጣ (ወይም ሌሎች ጨዋታዎች) -->
            <a href="#" onclick="alert('ይህ ጨዋታ በቅርብ ቀን ይመጣል!'); return false;" class="game-card">
                <div class="game-info">
                    <h3>ባህላዊ ገበጣ</h3>
                    <p>ባህላዊ የሰሌዳ ጨዋታ</p>
                </div>
                <div class="game-icon">🏺</div>
            </a>
        </div>
    </div>

    <script>
        let telegramId = "123456789";

        // የቴሌግራም ዌብ አፕ ዳታ ማንበብ
        if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe?.user) {
            const tgUser = window.Telegram.WebApp.initDataUnsafe.user;
            telegramId = tgUser.id.toString();
            document.getElementById('username').innerText = tgUser.first_name || 'ተጫዋች';
            syncUser(tgUser);
        } else {
            syncUser({ id: telegramId, first_name: "ሙከራ ተጫዋች", username: "test_user" });
        }

        // ተጠቃሚውን ከዳታቤዝ ጋር ማመሳሰል እና ባላንስ ማምጣት
        function syncUser(userData) {
            fetch('/api/wallet/sync', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    telegram_id: userData.id.toString(),
                    name: userData.first_name || 'User',
                    username: userData.username || ''
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('user-balance').innerText = data.user.balance;
                }
            });
        }

        function depositModal() {
            alert('የገንዘብ ማስገቢያ (Deposit) ሲስተም ቀጥሎ ይሰራል።');
        }
    </script>
</body>
</html>
