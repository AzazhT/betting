<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10131c">
  <title>Lucky Hub | ቢንጎ ጨዋታ</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Ethiopic:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: dark;
      --bg: #10131c;
      --panel: #191d29;
      --panel-light: #202535;
      --text: #f4f5f8;
      --muted: #9ca3b4;
      --accent: #8b6cff;
      --accent-2: #b09cff;
      --green: #4fe0a0;
      --border: rgba(255, 255, 255, .08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 80% 0%, rgba(117, 77, 255, .12), transparent 32rem),
        var(--bg);
      color: var(--text);
      font-family: "Inter", "Noto Sans Ethiopic", sans-serif;
      line-height: 1.6;
    }

    button, a, input { font: inherit; }
    a { color: inherit; text-decoration: none; }

    .container {
      width: min(1120px, calc(100% - 36px));
      margin: 0 auto;
    }

    /* Header */
    .topbar {
      border-bottom: 1px solid var(--border);
      background: rgba(16, 19, 28, .82);
      backdrop-filter: blur(14px);
    }

    .nav {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -.4px;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), #6044d9);
      box-shadow: 0 8px 24px rgba(139, 108, 255, .28);
      font-size: 19px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 26px;
      color: var(--muted);
      font-size: 14px;
    }

    .nav-links a:hover { color: var(--text); }

    .profile {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .balance {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      color: var(--green);
      font-size: 13px;
      font-weight: 700;
    }

    main { padding: 40px 0 70px; }

    .page-title {
      margin-bottom: 28px;
    }

    .page-title h1 {
      font-size: 28px;
      margin-bottom: 4px;
    }

    .page-title p {
      color: var(--muted);
      font-size: 14px;
    }

    /* Layout Grid */
    .game-layout {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 24px;
      align-items: start;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
    }

    /* Called Number Display */
    .called-box {
      background: var(--panel-light);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      text-align: center;
      margin-bottom: 20px;
    }

    .called-box small {
      color: var(--muted);
      font-size: 12px;
      display: block;
      margin-bottom: 4px;
    }

    .called-number {
      font-size: 36px;
      font-weight: 800;
      color: var(--green);
    }

    /* Bingo 5x5 Grid */
    .bingo-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    .bingo-cell {
      aspect-ratio: 1;
      background: var(--panel-light);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      transition: all .2s ease;
    }

    .bingo-cell:hover {
      border-color: var(--accent);
      transform: scale(1.02);
    }

    .bingo-cell.marked {
      background: rgba(79, 224, 160, .15);
      border-color: var(--green);
      color: var(--green);
    }

    .bingo-cell.free {
      background: rgba(139, 108, 255, .2);
      border-color: var(--accent-2);
      color: var(--accent-2);
      font-size: 12px;
    }

    /* Controls Sidebar */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 14px;
    }

    .stat-row span { color: var(--muted); }
    .stat-row strong { color: var(--text); }

    .action-btn {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: opacity .2s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #6044d9);
      color: #fff;
      box-shadow: 0 4px 16px rgba(139, 108, 255, .3);
    }

    .btn-green {
      background: var(--green);
      color: #10131c;
      margin-top: 10px;
    }

    .action-btn:hover { opacity: .9; }

    .game-msg {
      margin-top: 10px;
      font-size: 13px;
      text-align: center;
      min-height: 20px;
    }

    .msg-success { color: var(--green); }
    .msg-error { color: #ff7093; }

    footer {
      padding: 22px 0;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      margin-top: 40px;
    }

    @media (max-width: 768px) {
      .game-layout { grid-template-columns: 1fr; }
      .nav-links { display: none; }
    }
  </style>
</head>

<body>
  <!-- Header / Navigation -->
  <header class="topbar">
    <div class="container nav">
      <a class="brand" href="index.html">
        <span class="brand-mark">✦</span>
        <span>Lucky Hub</span>
      </a>

      <nav class="nav-links">
        <a href="index.html#games">ጨዋታዎች</a>
        <a href="history.html">ታሪክ</a>
      </nav>

      <div class="profile">
        <span class="balance">● <span id="user-balance">1,000</span> ነጥብ</span>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="page-title">
      <h1>🎱 ዕድል ሐሴት ቢንጎ</h1>
      <p>ቁጥሮችን ይከታተሉ፣ ካርቴላዎን ይሙሉ እና ምናባዊ ነጥቦችን ያሽንፉ!</p>
    </div>

    <div class="game-layout">
      <!-- የቢንጎ ካርቴላ (Board) -->
      <section class="card">
        <div class="called-box">
          <small>የወጣው ቁጥር (Called Number)</small>
          <div class="called-number" id="called-num">--</div>
        </div>

        <div class="bingo-grid" id="bingo-grid"></div>
      </section>

      <!-- መቆጣጠሪያ (Sidebar Controls) -->
      <aside class="card controls">
        <h2>የጨዋታ ሁኔታ</h2>

        <div class="stat-row">
          <span>የተመረጡ ሰቆች፡</span>
          <strong id="marked-count">1 / 25</strong>
        </div>

        <div class="stat-row">
          <span>የድል ሽልማት፡</span>
          <strong style="color: var(--green);">+250 ነጥብ</strong>
        </div>

        <hr style="border: 0; border-top: 1px solid var(--border); margin: 6px 0;">

        <button class="action-btn btn-primary" id="call-btn" type="button">ቁጥር አውጣ</button>
        <button class="action-btn btn-green" id="claim-btn" type="button">ቢንጎ ነኝ!</button>

        <p class="game-msg" id="msg"></p>
      </aside>
    </div>
  </main>

  <footer>
    <div class="container">© 2026 Lucky Hub · በኃላፊነት ይጫወቱ</div>
  </footer>

  <script>
    "use strict";

    const $ = id => document.getElementById(id);
    let balance = 1000;
    let markedCells = new Set([12]); // Index 12 is FREE space
    let cardNumbers = [];

    // 25 የዘፈቀደ ቁጥሮችን ማዘጋጀት
    function generateCard() {
      const nums = [];
      while (nums.length < 24) {
        let r = Math.floor(Math.random() * 75) + 1;
        if (!nums.includes(r)) nums.push(r);
      }
      nums.splice(12, 0, "FREE");
      return nums;
    }

    function renderBoard() {
      const grid = $("bingo-grid");
      grid.innerHTML = "";

      cardNumbers.forEach((num, idx) => {
        const cell = document.createElement("div");
        cell.className = "bingo-cell";
        cell.textContent = num;

        if (num === "FREE") {
          cell.classList.add("free", "marked");
        } else if (markedCells.has(idx)) {
          cell.classList.add("marked");
        }

        cell.onclick = () => {
          if (num === "FREE") return;

          if (markedCells.has(idx)) {
            markedCells.delete(idx);
            cell.classList.remove("marked");
          } else {
            markedCells.add(idx);
            cell.classList.add("marked");
          }
          $("marked-count").textContent = `${markedCells.size} / 25`;
        };

        grid.appendChild(cell);
      });
    }

    // ቁጥር ማውጣት
    $("call-btn").onclick = () => {
      const rand = Math.floor(Math.random() * 75) + 1;
      $("called-num").textContent = rand;
      $("msg").textContent = `አዲስ ቁጥር ወጥቷል: ${rand}`;
      $("msg").className = "game-msg";
    };

    // ቢንጎ ማረጋገጥ
    $("claim-btn").onclick = () => {
      if (markedCells.size >= 5) {
        balance += 250;
        $("user-balance").textContent = balance.toLocaleString();
        $("msg").textContent = "እንኳን ደስ አሎት! ቢንጎ ደርሰዋል (+250 ነጥብ)!";
        $("msg").className = "game-msg msg-success";
      } else {
        $("msg").textContent = "ገና አላሸነፉም! ቢያንስ 5 ሰቆች መምረጥ አለብዎት።";
        $("msg").className = "game-msg msg-error";
      }
    };

    // ማስጀመር
    cardNumbers = generateCard();
    renderBoard();
  </script>
</body>
</html>
