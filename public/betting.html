<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Football Betting</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        #07111f;

      color: #ffffff;

      min-height: 100vh;
    }

    button,
    input {
      font-family: inherit;
    }

    .app {
      width: 100%;
      max-width: 1400px;
      margin: auto;
    }

    /* =====================================================
       HEADER
       ===================================================== */

    header {
      position: sticky;
      top: 0;

      z-index: 100;

      background: #0b1728;

      border-bottom:
        1px solid #1d3048;

      padding: 14px 18px;
    }

    .header-row {
      display: flex;

      align-items: center;

      justify-content:
        space-between;

      gap: 15px;
    }

    .logo {
      font-size: 21px;

      font-weight: 800;

      white-space: nowrap;
    }

    .logo span {
      color: #21d07a;
    }

    .wallet {
      display: flex;

      align-items: center;

      gap: 8px;

      background: #13243a;

      border:
        1px solid #29405d;

      border-radius: 10px;

      padding: 9px 13px;

      font-weight: 700;
    }

    .wallet strong {
      color: #21d07a;
    }

    /* =====================================================
       NAV
       ===================================================== */

    .nav {
      display: flex;

      gap: 8px;

      overflow-x: auto;

      padding: 12px 15px;

      background: #091524;

      border-bottom:
        1px solid #172a41;
    }

    .nav button {
      border: none;

      background: #13243a;

      color: #b9c8d9;

      padding:
        9px 15px;

      border-radius: 8px;

      cursor: pointer;

      white-space: nowrap;
    }

    .nav button.active {
      background: #21d07a;

      color: #04120b;

      font-weight: 700;
    }

    /* =====================================================
       LAYOUT
       ===================================================== */

    .layout {
      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        360px;

      gap: 18px;

      padding: 18px;
    }

    .main {
      min-width: 0;
    }

    /* =====================================================
       TOP BAR
       ===================================================== */

    .topbar {
      display: flex;

      justify-content:
        space-between;

      align-items: center;

      gap: 10px;

      margin-bottom: 15px;
    }

    .title {
      font-size: 23px;

      font-weight: 800;
    }

    .refresh {
      background: #13243a;

      border:
        1px solid #29405d;

      color: #ffffff;

      padding: 9px 13px;

      border-radius: 8px;

      cursor: pointer;
    }

    .refresh:hover {
      background: #1b324e;
    }

    /* =====================================================
       SEARCH
       ===================================================== */

    .search {
      width: 100%;

      margin-bottom: 15px;
    }

    .search input {
      width: 100%;

      background: #0e1d30;

      color: #ffffff;

      border:
        1px solid #263d58;

      outline: none;

      border-radius: 9px;

      padding: 13px 14px;

      font-size: 15px;
    }

    .search input:focus {
      border-color: #21d07a;
    }

    /* =====================================================
       EVENT CARD
       ===================================================== */

    .event {
      background: #0c1b2d;

      border:
        1px solid #1d334d;

      border-radius: 12px;

      margin-bottom: 13px;

      overflow: hidden;
    }

    .league {
      background: #101f33;

      padding: 9px 12px;

      color: #a9b9ca;

      font-size: 13px;

      font-weight: 700;
    }

    .event-head {
      display: flex;

      align-items: center;

      justify-content:
        space-between;

      gap: 10px;

      padding: 13px;
    }

    .teams {
      min-width: 0;

      flex: 1;
    }

    .team {
      display: flex;

      justify-content:
        space-between;

      align-items: center;

      padding: 4px 0;

      font-weight: 700;
    }

    .team-name {
      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;
    }

    .score {
      margin-left: 10px;

      color: #ffffff;
    }

    .match-status {
      font-size: 11px;

      color: #9cb0c5;

      margin-top: 5px;
    }

    .live {
      color: #ff5d5d;

      font-weight: 800;
    }

    /* =====================================================
       ODDS
       ===================================================== */

    .markets {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 7px;

      padding:
        0 12px
        12px;
    }

    .odd {
      border:
        1px solid #28415e;

      background: #13263d;

      color: #ffffff;

      border-radius: 8px;

      padding: 10px 7px;

      cursor: pointer;

      min-width: 0;
    }

    .odd:hover {
      background: #1b3551;
    }

    .odd.selected {
      background: #21d07a;

      color: #04120b;

      border-color: #21d07a;
    }

    .odd-label {
      display: block;

      font-size: 11px;

      opacity: 0.75;

      margin-bottom: 3px;
    }

    .odd-price {
      font-weight: 800;

      font-size: 14px;
    }

    .no-odds {
      grid-column:
        1 / -1;

      color: #8498ad;

      font-size: 13px;

      padding: 4px 0;
    }

    /* =====================================================
       BET SLIP
       ===================================================== */

    .slip {
      position: sticky;

      top: 80px;

      background: #0c1b2d;

      border:
        1px solid #1d334d;

      border-radius: 12px;

      overflow: hidden;

      height: fit-content;
    }

    .slip-title {
      padding: 14px;

      background: #101f33;

      font-size: 18px;

      font-weight: 800;
    }

    .slip-body {
      padding: 13px;
    }

    .empty {
      text-align: center;

      color: #7f93a9;

      padding:
        30px 10px;
    }

    .selection {
      border-bottom:
        1px solid #20364f;

      padding:
        10px 0;
    }

    .selection:last-child {
      border-bottom: none;
    }

    .selection-top {
      display: flex;

      justify-content:
        space-between;

      gap: 8px;
    }

    .selection-name {
      font-weight: 700;

      font-size: 13px;
    }

    .selection-odds {
      color: #21d07a;

      font-weight: 800;
    }

    .selection-match {
      color: #7f93a9;

      font-size: 11px;

      margin-top: 4px;
    }

    .remove {
      border: none;

      background: transparent;

      color: #ff6565;

      cursor: pointer;

      font-size: 12px;

      margin-top: 5px;
    }

    /* =====================================================
       BET TYPE
       ===================================================== */

    .bet-type {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 7px;

      margin-top: 13px;
    }

    .bet-type button {
      background: #13263d;

      color: #b8c7d7;

      border:
        1px solid #29415d;

      padding: 9px;

      border-radius: 7px;

      cursor: pointer;
    }

    .bet-type button.active {
      background: #21d07a;

      color: #04120b;

      font-weight: 700;
    }

    /* =====================================================
       STAKE
       ===================================================== */

    .stake {
      margin-top: 13px;
    }

    .stake label {
      display: block;

      font-size: 12px;

      color: #91a4b9;

      margin-bottom: 6px;
    }

    .stake input {
      width: 100%;

      background: #081627;

      border:
        1px solid #29415d;

      color: #ffffff;

      border-radius: 8px;

      padding: 11px;

      outline: none;
    }

    .stake input:focus {
      border-color: #21d07a;
    }

    /* =====================================================
       SUMMARY
       ===================================================== */

    .summary {
      margin-top: 15px;

      border-top:
        1px solid #20364f;

      padding-top: 12px;
    }

    .summary-row {
      display: flex;

      justify-content:
        space-between;

      margin: 8px 0;

      color: #9eb0c3;

      font-size: 13px;
    }

    .summary-row strong {
      color: #ffffff;
    }

    .potential {
      color: #21d07a !important;

      font-size: 17px;
    }

    .place {
      width: 100%;

      margin-top: 12px;

      border: none;

      background: #21d07a;

      color: #04120b;

      font-size: 16px;

      font-weight: 800;

      padding: 13px;

      border-radius: 9px;

      cursor: pointer;
    }

    .place:hover {
      opacity: 0.9;
    }

    .place:disabled {
      background: #345044;

      color: #81998d;

      cursor: not-allowed;
    }

    /* =====================================================
       MESSAGE
       ===================================================== */

    .message {
      position: fixed;

      left: 50%;

      bottom: 25px;

      transform:
        translateX(-50%);

      z-index: 999;

      padding:
        12px 18px;

      border-radius: 9px;

      background: #13263d;

      border:
        1px solid #29415d;

      display: none;

      max-width: 90%;

      text-align: center;
    }

    .message.show {
      display: block;
    }

    .message.success {
      border-color: #21d07a;
    }

    .message.error {
      border-color: #ff5d5d;
    }

    /* =====================================================
       LOADING
       ===================================================== */

    .loading {
      padding: 40px 15px;

      text-align: center;

      color: #8ca0b5;
    }

    .spinner {
      width: 30px;

      height: 30px;

      border:
        3px solid #243a54;

      border-top-color:
        #21d07a;

      border-radius: 50%;

      margin:
        0 auto 12px;

      animation:
        spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform:
          rotate(360deg);
      }
    }

    /* =====================================================
       RESPONSIVE
       ===================================================== */

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .slip {
        position: relative;

        top: 0;
      }
    }

    @media (max-width: 500px) {
      header {
        padding: 12px;
      }

      .layout {
        padding: 12px;
      }

      .logo {
        font-size: 17px;
      }

      .wallet {
        font-size: 12px;
      }

      .markets {
        grid-template-columns:
          repeat(3, 1fr);
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- =====================================================
       HEADER
       ===================================================== -->

  <header>

    <div class="header-row">

      <div class="logo">
        ⚽ <span>Football</span> Betting
      </div>

      <div class="wallet">
        💰
        <span>Balance:</span>
        <strong id="balance">0.00 ETB</strong>
      </div>

    </div>

  </header>


  <!-- =====================================================
       NAV
       ===================================================== -->

  <nav class="nav">

    <button
      class="active"
      data-filter="all"
      onclick="changeFilter('all', this)"
    >
      ⚽ All
    </button>

    <button
      data-filter="live"
      onclick="changeFilter('live', this)"
    >
      🔴 LIVE
    </button>

    <button
      data-filter="today"
      onclick="changeFilter('today', this)"
    >
      📅 Today
    </button>

    <button
      data-filter="tomorrow"
      onclick="changeFilter('tomorrow', this)"
    >
      📅 Tomorrow
    </button>

  </nav>


  <!-- =====================================================
       MAIN LAYOUT
       ===================================================== -->

  <div class="layout">

    <main class="main">

      <div class="topbar">

        <div class="title">
          Football Matches
        </div>

        <button
          class="refresh"
          onclick="loadEvents()"
        >
          🔄 Refresh
        </button>

      </div>


      <div class="search">

        <input
          id="search"
          type="text"
          placeholder="Search team or league..."
          oninput="renderEvents()"
        >

      </div>


      <div id="events">

        <div class="loading">

          <div class="spinner"></div>

          Loading football matches...

        </div>

      </div>

    </main>


    <!-- ===================================================
         BET SLIP
         =================================================== -->

    <aside class="slip">

      <div class="slip-title">
        🧾 Bet Slip
      </div>

      <div class="slip-body">

        <div
          id="slipSelections"
          class="empty"
        >
          Select odds to add them to your bet slip.
        </div>


        <div
          id="betControls"
          style="display:none"
        >

          <div class="bet-type">

            <button
              id="singleBtn"
              class="active"
              onclick="setBetType('single')"
            >
              Single
            </button>

            <button
              id="comboBtn"
              onclick="setBetType('combo')"
            >
              Combo
            </button>

          </div>


          <div class="stake">

            <label>
              Stake (ETB)
            </label>

            <input
              id="stake"
              type="number"
              min="1"
              step="1"
              value="10"
              oninput="updateSlip()"
            >

          </div>


          <div class="summary">

            <div class="summary-row">
              <span>Selections</span>

              <strong id="selectionCount">
                0
              </strong>
            </div>


            <div class="summary-row">
              <span>Total Odds</span>

              <strong id="totalOdds">
                0.00
              </strong>
            </div>


            <div class="summary-row">
              <span>Stake</span>

              <strong id="stakeDisplay">
                0.00 ETB
              </strong>
            </div>


            <div class="summary-row">

              <span>
                Potential Win
              </span>

              <strong
                id="potentialWin"
                class="potential"
              >
                0.00 ETB
              </strong>

            </div>


            <button
              id="placeBtn"
              class="place"
              onclick="placeBet()"
            >
              PLACE BET
            </button>

          </div>

        </div>

      </div>

    </aside>

  </div>

</div>


<div
  id="message"
  class="message"
></div>


<script>
  /* =======================================================
     STATE
     ======================================================= */

  let events = [];

  let selections = [];

  let currentFilter = "all";

  let betType = "single";

  const userId =
    new URLSearchParams(
      window.location.search
    ).get("userId") || "demo";


  /* =======================================================
     MESSAGE
     ======================================================= */

  function showMessage(
    text,
    type = "success"
  ) {

    const box =
      document.getElementById("message");

    box.textContent = text;

    box.className =
      "message show " + type;

    setTimeout(() => {
      box.className = "message";
    }, 3000);
  }


  /* =======================================================
     FORMAT MONEY
     ======================================================= */

  function money(value) {

    return Number(value || 0)
      .toLocaleString(
        "en-US",
        {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }
      ) + " ETB";
  }


  /* =======================================================
     FORMAT DATE
     ======================================================= */

  function formatDate(value) {

    if (!value) {
      return "";
    }

    const date =
      new Date(value);

    if (
      Number.isNaN(
        date.getTime()
      )
    ) {
      return String(value);
    }

    return date.toLocaleString(
      "en-US",
      {
        month: "short",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      }
    );
  }


  /* =======================================================
     LOAD WALLET
     ======================================================= */

  async function loadWallet() {

    try {

      const response =
        await fetch(
          `/api/wallet?userId=${encodeURIComponent(userId)}`
        );

      const data =
        await response.json();

      if (
        data.success &&
        data.wallet
      ) {

        document.getElementById(
          "balance"
        ).textContent =
          money(data.wallet.balance);

      }

    } catch (error) {

      console.error(
        "Wallet error:",
        error
      );

    }

  }


  /* =======================================================
     LOAD EVENTS
     ======================================================= */

  async function loadEvents() {

    const container =
      document.getElementById(
        "events"
      );

    container.innerHTML = `
      <div class="loading">
        <div class="spinner"></div>
        Loading football matches...
      </div>
    `;

    try {

      const response =
        await fetch(
          "/api/events"
        );

      const data =
        await response.json();

      if (!data.success) {

        throw new Error(
          data.error ||
          "Could not load matches."
        );

      }

      events =
        Array.isArray(data.events)
          ? data.events
          : [];

      renderEvents();

    } catch (error) {

      console.error(error);

      container.innerHTML = `
        <div class="loading">
          ❌ ${escapeHtml(
            error.message ||
            "Could not load football matches."
          )}

          <br><br>

          <button
            class="refresh"
            onclick="loadEvents()"
          >
            Try Again
          </button>
        </div>
      `;

    }

  }


  /* =======================================================
     FILTER
     ======================================================= */

  function changeFilter(
    filter,
    button
  ) {

    currentFilter =
      filter;

    document
      .querySelectorAll(
        ".nav button"
      )
      .forEach(
        btn =>
          btn.classList.remove(
            "active"
          )
      );

    button.classList.add(
      "active"
    );

    renderEvents();
  }


  /* =======================================================
     FILTER EVENT LIST
     ======================================================= */

  function getFilteredEvents() {

    const search =
      document
        .getElementById(
          "search"
        )
        .value
        .toLowerCase()
        .trim();

    return events.filter(
      event => {

        const text =
          (
            event.home?.name +
            " " +
            event.away?.name +
            " " +
            event.league
          )
          .toLowerCase();

        if (
          search &&
          !text.includes(search)
        ) {
          return false;
        }

        if (
          currentFilter === "live"
        ) {
          return event.live === true;
        }

        if (
          currentFilter === "today"
        ) {

          if (!event.startTime) {
            return false;
          }

          const now =
            new Date();

          const date =
            new Date(
              event.startTime
            );

          return (
            date.toDateString() ===
            now.toDateString()
          );
        }

        if (
          currentFilter ===
          "tomorrow"
        ) {

          if (!event.startTime) {
            return false;
          }

          const tomorrow =
            new Date();

          tomorrow.setDate(
            tomorrow.getDate() + 1
          );

          const date =
            new Date(
              event.startTime
            );

          return (
            date.toDateString() ===
            tomorrow.toDateString()
          );
        }

        return true;
      }
    );

  }


  /* =======================================================
     RENDER EVENTS
     ======================================================= */

  function renderEvents() {

    const container =
      document.getElementById(
        "events"
      );

    const filtered =
      getFilteredEvents();

    if (
      filtered.length === 0
    ) {

      container.innerHTML = `
        <div class="loading">
          No football matches found.
        </div>
      `;

      return;
    }

    container.innerHTML =
      filtered
        .map(
          event =>
            eventCard(event)
        )
        .join("");

  }


  /* =======================================================
     EVENT CARD
     ======================================================= */

  function eventCard(event) {

    const odds =
      event.odds || {};

    const selected1 =
      isSelected(
        event.id,
        "1"
      );

    const selectedX =
      isSelected(
        event.id,
        "X"
      );

    const selected2 =
      isSelected(
        event.id,
        "2"
      );

    const selectedOver =
      isSelected(
        event.id,
        "over"
      );

    const selectedUnder =
      isSelected(
        event.id,
        "under"
      );

    const selectedYes =
      isSelected(
        event.id,
        "bttsYes"
      );

    const selectedNo =
      isSelected(
        event.id,
        "bttsNo"
      );


    return `

      <div class="event">

        <div class="league">

          🏆
          ${escapeHtml(
            event.league ||
            "Football"
          )}

        </div>


        <div class="event-head">

          <div class="teams">

            <div class="team">

              <span class="team-name">
                ${escapeHtml(
                  event.home?.name ||
                  "Home"
                )}
              </span>

              ${
                event.live
                  ? `<span class="score">
                      ${event.score?.home ?? 0}
                    </span>`
                  : ""
              }

            </div>


            <div class="team">

              <span class="team-name">
                ${escapeHtml(
                  event.away?.name ||
                  "Away"
                )}
              </span>

              ${
                event.live
                  ? `<span class="score">
                      ${event.score?.away ?? 0}
                    </span>`
                  : ""
              }

            </div>


            <div
              class="match-status
                ${event.live ? "live" : ""}"
            >

              ${
                event.live
                  ? "🔴 LIVE"
                  : escapeHtml(
                      formatDate(
                        event.startTime
                      )
                    )
              }

            </div>

          </div>

        </div>


        <div class="markets">

          ${oddButton(
            event,
            "1",
            "1",
            odds["1"],
            selected1
          )}

          ${oddButton(
            event,
            "X",
            "X",
            odds.X,
            selectedX
          )}

          ${oddButton(
            event,
            "2",
            "2",
            odds["2"],
            selected2
          )}

          ${oddButton(
            event,
            "Over",
            "Over",
            odds.over,
            selectedOver
          )}

          ${oddButton(
            event,
            "Under",
            "Under",
            odds.under,
            selectedUnder
          )}

          ${oddButton(
            event,
            "BTTS Yes",
            "bttsYes",
            odds.bttsYes,
            selectedYes
          )}

          ${oddButton(
            event,
            "BTTS No",
            "bttsNo",
            odds.bttsNo,
            selectedNo
          )}

        </div>

      </div>

    `;

  }


  /* =======================================================
     ODDS BUTTON
     ======================================================= */

  function oddButton(
    event,
    label,
    selection,
    odds,
    selected
  ) {

    const price =
      Number(odds);

    if (
      !Number.isFinite(price) ||
      price <= 1
    ) {

      return `
        <div class="odd">
          <span class="odd-label">
            ${escapeHtml(label)}
          </span>

          <span class="odd-price">
            -
          </span>
        </div>
      `;

    }

    return `
      <button
        class="odd ${
          selected
            ? "selected"
            : ""
        }"
        onclick="toggleSelection(
          '${escapeJs(event.id)}',
          '${escapeJs(
            event.home?.name || ""
          )}',
          '${escapeJs(
            event.away?.name || ""
          )}',
          '${escapeJs(
            label
          )}',
          '${escapeJs(
            selection
          )}',
          ${price}
        )"
      >

        <span class="odd-label">
          ${escapeHtml(label)}
        </span>

        <span class="odd-price">
          ${price.toFixed(2)}
        </span>

      </button>
    `;

  }


  /* =======================================================
     SELECTION CHECK
     ======================================================= */

  function isSelected(
    eventId,
    selection
  ) {

    return selections.some(
      item =>
        item.eventId ===
          String(eventId) &&
        item.selection ===
          selection
    );

  }


  /* =======================================================
     TOGGLE SELECTION
     ======================================================= */

  function toggleSelection(
    eventId,
    home,
    away,
    market,
    selection,
    odds
  ) {

    const existingIndex =
      selections.findIndex(
        item =>
          item.eventId ===
            String(eventId) &&
          item.selection ===
            selection
      );


    if (
      existingIndex >= 0
    ) {

      selections.splice(
        existingIndex,
        1
      );

    } else {

      /*
       * For a single match,
       * don't allow multiple
       * selections from the
       * same event.
       */

      const sameEventIndex =
        selections.findIndex(
          item =>
            item.eventId ===
            String(eventId)
        );

      if (
        sameEventIndex >= 0
      ) {

        selections.splice(
          sameEventIndex,
          1
        );

      }

      selections.push({
        eventId:
          String(eventId),

        match:
          `${home} vs ${away}`,

        market,

        selection,

        odds:
          Number(odds)
      });

    }

    renderEvents();

    updateSlip();

  }


  /* =======================================================
     BET TYPE
     ======================================================= */

  function setBetType(
    type
  ) {

    betType =
      type;

    document
      .getElementById(
        "singleBtn"
      )
      .classList.toggle(
        "active",
        type === "single"
      );

    document
      .getElementById(
        "comboBtn"
      )
      .classList.toggle(
        "active",
        type === "combo"
      );

    updateSlip();

  }


  /* =======================================================
     UPDATE SLIP
     ======================================================= */

  function updateSlip() {

    const box =
      document.getElementById(
        "slipSelections"
      );

    const controls =
      document.getElementById(
        "betControls"
      );


    if (
      selections.length === 0
    ) {

      box.className =
        "empty";

      box.innerHTML =
        "Select odds to add them to your bet slip.";

      controls.style.display =
        "none";

      return;

    }


    controls.style.display =
      "block";

    box.className = "";


    box.innerHTML =
      selections
        .map(
          (item, index) => `

            <div class="selection">

              <div
                class="selection-top"
              >

                <div
                  class="selection-name"
                >
                  ${escapeHtml(
                    item.market
                  )}
                </div>

                <div
                  class="selection-odds"
                >
                  ${Number(
                    item.odds
                  ).toFixed(2)}
                </div>

              </div>

              <div
                class="selection-match"
              >
                ${escapeHtml(
                  item.match
                )}
              </div>

              <button
                class="remove"
                onclick="removeSelection(
                  ${index}
                )"
              >
                ✕ Remove
              </button>

            </div>

          `
        )
        .join("");


    let totalOdds = 1;

    if (
      betType === "combo"
    ) {

      selections.forEach(
        item => {
          totalOdds *=
            Number(
              item.odds
            );
        }
      );

    } else {

      /*
       * For single mode,
       * use the first selection.
       */

      totalOdds =
        Number(
          selections[0].odds
        );

    }


    const stake =
      Number(
        document.getElementById(
          "stake"
        ).value
      ) || 0;


    const potentialWin =
      stake *
      totalOdds;


    document.getElementById(
      "selectionCount"
    ).textContent =
      selections.length;


    document.getElementById(
      "totalOdds"
    ).textContent =
      totalOdds.toFixed(2);


    document.getElementById(
      "stakeDisplay"
    ).textContent =
      money(stake);


    document.getElementById(
      "potentialWin"
    ).textContent =
      money(potentialWin);

  }


  /* =======================================================
     REMOVE SELECTION
     ======================================================= */

  function removeSelection(
    index
  ) {

    selections.splice(
      index,
      1
    );

    renderEvents();

    updateSlip();

  }


  /* =======================================================
     PLACE BET
     ======================================================= */

  async function placeBet() {

    if (
      selections.length === 0
    ) {

      showMessage(
        "Please select odds first.",
        "error"
      );

      return;

    }


    const stake =
      Number(
        document.getElementById(
          "stake"
        ).value
      );


    if (
      !Number.isFinite(stake) ||
      stake <= 0
    ) {

      showMessage(
        "Enter a valid stake.",
        "error"
      );

      return;

    }


    if (
      betType === "combo" &&
      selections.length < 2
    ) {

      showMessage(
        "Combo needs at least 2 selections.",
        "error"
      );

      return;

    }


    const btn =
      document.getElementById(
        "placeBtn"
      );

    btn.disabled =
      true;

    btn.textContent =
      "PLACING...";


    try {

      const response =
        await fetch(
          "/api/bet",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                userId,

                stake,

                selections
              })
          }
        );


      const data =
        await response.json();


      if (
        !data.success
      ) {

        throw new Error(
          data.error ||
          "Bet failed."
        );

      }


      selections = [];

      updateSlip();

      await loadWallet();

      renderEvents();


      showMessage(
        "✅ Demo bet placed successfully.",
        "success"
      );

    } catch (error) {

      showMessage(
        error.message ||
        "Bet failed.",
        "error"
      );

    } finally {

      btn.disabled =
        false;

      btn.textContent =
        "PLACE BET";

    }

  }


  /* =======================================================
     ESCAPE HTML
     ======================================================= */

  function escapeHtml(
    value
  ) {

    return String(
      value ?? ""
    )
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  /* =======================================================
     ESCAPE JS
     ======================================================= */

  function escapeJs(
    value
  ) {

    return String(
      value ?? ""
    )
      .replace(
        /\\/g,
        "\\\\"
      )
      .replace(
        /'/g,
        "\\'"
      )
      .replace(
        /\n/g,
        "\\n"
      )
      .replace(
        /\r/g,
        "\\r"
      );

  }


  /* =======================================================
     START
     ======================================================= */

  loadWallet();

  loadEvents();

  /*
   * Refresh football data every 30 seconds.
   */

  setInterval(
    loadEvents,
    30000
  );

</script>

</body>
</html>
