<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Football Betting — Demo</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Arial,Helvetica,sans-serif;background:#07111f;color:#fff;min-height:100vh}
    button,input{font-family:inherit}
    button{cursor:pointer}
    button:disabled{cursor:not-allowed;opacity:.55}
    .app{max-width:1400px;margin:auto}
    header{position:sticky;top:0;z-index:100;background:#0b1728;border-bottom:1px solid #1d3048;padding:14px 18px}
    .header-row,.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .logo{font-size:21px;font-weight:800}
    .logo span,.wallet strong{color:#21d07a}
    .wallet{background:#13243a;border:1px solid #29405d;border-radius:10px;padding:9px 13px;font-weight:700}
    .nav{display:flex;gap:8px;overflow:auto;padding:12px 15px;background:#091524}
    .nav button,.refresh,.bet-type button{background:#13243a;border:1px solid #29405d;color:#b9c8d9;padding:9px 15px;border-radius:8px;white-space:nowrap}
    .nav button.active,.bet-type button.active{background:#21d07a;color:#04120b;font-weight:700}
    .layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;padding:18px}
    main{min-width:0}
    .topbar{margin-bottom:15px}
    .title{font-size:23px;font-weight:800}
    .search{width:100%;background:#0e1d30;color:#fff;border:1px solid #263d58;border-radius:9px;padding:13px;margin-bottom:15px;font-size:15px}
    input:focus{outline:1px solid #21d07a}
    .info{color:#9cb0c5;font-size:12px;margin-bottom:12px;line-height:1.6}
    .event{background:#0c1b2d;border:1px solid #1d334d;border-radius:12px;margin-bottom:13px;overflow:hidden}
    .league,.slip-title{background:#101f33;padding:10px 13px;font-weight:700;color:#a9b9ca}
    .event-head{padding:13px}
    .team{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-weight:700}
    .team-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .match-status{font-size:12px;color:#9cb0c5;margin-top:7px}
    .live{color:#ff5d5d;font-weight:800}
    .markets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;padding:0 12px 12px}
    .odd{border:1px solid #28415e;background:#13263d;color:#fff;border-radius:8px;padding:10px 7px;min-width:0}
    .odd:hover:not(:disabled){background:#1b3551}
    .odd.selected{background:#21d07a;color:#04120b;border-color:#21d07a}
    .odd-label{display:block;font-size:11px;margin-bottom:4px}
    .odd-price{font-weight:800;font-size:14px}
    .more{grid-column:1/-1;background:#162c46;border:1px solid #2e4c70;color:#21d07a;padding:9px;border-radius:7px;font-weight:700}
    .extra{grid-column:1/-1;background:#091524;border-radius:8px;padding:10px}
    .group-title{font-size:12px;color:#a9b9ca;margin:10px 0 6px}
    .group{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
    .slip{position:sticky;top:80px;background:#0c1b2d;border:1px solid #1d334d;border-radius:12px;overflow:hidden;height:fit-content}
    .slip-title{font-size:18px;color:#fff}
    .slip-body{padding:13px}
    .empty,.loading{text-align:center;color:#8ca0b5;padding:30px 10px;line-height:1.7}
    .selection{border-bottom:1px solid #20364f;padding:10px 0}
    .selection-top,.summary-row{display:flex;justify-content:space-between;gap:8px}
    .selection-name{font-size:13px;font-weight:700}
    .selection-odds,.potential{color:#21d07a;font-weight:800}
    .selection-match{color:#8ca0b5;font-size:12px;margin-top:5px}
    .remove{background:none;border:0;color:#ff6565;margin-top:6px}
    .bet-type{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:13px}
    .stake{margin-top:13px}
    .stake label{display:block;font-size:12px;color:#91a4b9;margin-bottom:6px}
    .stake input{width:100%;background:#081627;border:1px solid #29415d;color:#fff;border-radius:8px;padding:11px}
    .summary{margin-top:15px;border-top:1px solid #20364f;padding-top:12px}
    .summary-row{margin:9px 0;color:#9eb0c3;font-size:13px}
    .summary-row strong{color:#fff}
    .summary-row .potential{color:#21d07a;font-size:17px}
    .place{width:100%;margin-top:12px;border:0;background:#21d07a;color:#04120b;font-size:16px;font-weight:800;padding:13px;border-radius:9px}
    .message{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);z-index:999;padding:12px 18px;border-radius:9px;background:#13263d;border:1px solid #21d07a;max-width:90%;text-align:center}
    .message.error{border-color:#ff5d5d}
    .leagues{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
    .leagues button{white-space:normal;text-align:left}
    .spinner{width:30px;height:30px;border:3px solid #243a54;border-top-color:#21d07a;border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:900px){.layout{grid-template-columns:1fr}.slip{position:relative;top:0}}
    @media(max-width:480px){.header-row{align-items:flex-start;flex-direction:column}.layout{padding:10px}.title{font-size:19px}}
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="header-row">
      <div class="logo">⚽ <span>Football</span> Betting <small>Demo</small></div>
      <div class="wallet">💰 Balance: <strong id="balance">0.00 ETB</strong></div>
    </div>
  </header>

  <nav class="nav" id="nav">
    <button data-filter="all">⚽ All</button>
    <button data-filter="live">🔴 LIVE</button>
    <button data-filter="today" class="active">📅 Today</button>
    <button data-filter="tomorrow">📅 Tomorrow</button>
    <button data-filter="leagues">🏆 Leagues</button>
  </nav>

  <div class="layout">
    <main>
      <div class="topbar">
        <div class="title" id="title">Today's Football Matches</div>
        <button class="refresh" id="refresh">🔄 Refresh</button>
      </div>
      <input class="search" id="search" placeholder="Search team or league...">
      <div class="info" id="info"></div>
      <div id="events"></div>
    </main>

    <aside class="slip">
      <div class="slip-title">🧾 Bet Slip</div>
      <div class="slip-body">
        <div id="slipSelections" class="empty">Select odds to add them to your bet slip.</div>
        <div id="betControls" hidden>
          <div class="bet-type">
            <button id="singleBtn" class="active">Single</button>
            <button id="comboBtn">Combo</button>
          </div>
          <div class="stake">
            <label for="stake">Stake (ETB)</label>
            <input id="stake" type="number" min="1" step="1" value="10">
          </div>
          <div class="summary">
            <div class="summary-row"><span>Selections</span><strong id="selectionCount">0</strong></div>
            <div class="summary-row"><span>Total Odds</span><strong id="totalOdds">0.00</strong></div>
            <div class="summary-row"><span>Stake</span><strong id="stakeDisplay">0.00 ETB</strong></div>
            <div class="summary-row"><span>Potential Win</span><strong id="potentialWin" class="potential">0.00 ETB</strong></div>
            <button class="place" id="placeBtn">PLACE DEMO BET</button>
          </div>
        </div>
      </div>
    </aside>
  </div>
</div>
<div id="message" class="message" role="status" hidden></div>

<script>
  const TIME_ZONE = "Africa/Addis_Ababa";
  const userId = new URLSearchParams(location.search).get("userId") || "demo";
  const $ = id => document.getElementById(id);

  let events = [];
  let selections = [];
  let currentFilter = "today";
  let selectedLeague = null;
  let betType = "single";
  let requestVersion = 0;
  let messageTimer;
  let loading = false;
  let submitting = false;
  const expandedEvents = new Set();
  const loadingOdds = new Set();

  const marketDefinitions = [
    { key: "1", label: "1", group: "result" },
    { key: "X", label: "X", group: "result" },
    { key: "2", label: "2", group: "result" },
    { key: "over25", label: "Over 2.5", group: "total25" },
    { key: "under25", label: "Under 2.5", group: "total25" },
    { key: "bttsYes", label: "BTTS Yes", group: "btts" },
    { key: "1X", label: "1X", group: "doubleChance" },
    { key: "12", label: "12", group: "doubleChance" },
    { key: "X2", label: "X2", group: "doubleChance" },
    { key: "over15", label: "Over 1.5", group: "total15" },
    { key: "under15", label: "Under 1.5", group: "total15" },
    { key: "over35", label: "Over 3.5", group: "total35" },
    { key: "under35", label: "Under 3.5", group: "total35" },
    { key: "bttsNo", label: "BTTS No", group: "btts" }
  ];

  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;",
      '"': "&quot;", "'": "&#039;"
    })[char]);
  }

  function money(value) {
    return Number(value || 0).toLocaleString("en-US", {
      minimumFractionDigits: 2, maximumFractionDigits: 2
    }) + " ETB";
  }

  function formatDate(value) {
    if (!value) return "Kickoff time unavailable";
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return "Kickoff time unavailable";
    return date.toLocaleString("en-US", {
      timeZone: TIME_ZONE,
      month: "short", day: "numeric",
      hour: "2-digit", minute: "2-digit"
    }) + " EAT";
  }

  function showMessage(text, type = "success") {
    clearTimeout(messageTimer);
    $("message").textContent = text;
    $("message").className = "message " + type;
    $("message").hidden = false;
    messageTimer = setTimeout(() => $("message").hidden = true, 4000);
  }

  async function request(url, options) {
    const response = await fetch(url, options);
    const data = await response.json();
    if (!response.ok || !data.success) {
      throw new Error(data.error || "Request failed.");
    }
    return data;
  }

  async function loadWallet() {
    try {
      const data = await request(`/api/wallet?userId=${encodeURIComponent(userId)}`);
      $("balance").textContent = money(data.wallet.balance);
    } catch (error) {
      showMessage(error.message, "error");
    }
  }

  async function loadEvents() {
    const version = ++requestVersion;
    loading = true;
    const filter = currentFilter === "leagues" ? "all" : currentFilter;

    $("events").innerHTML = `
      <div class="loading"><div class="spinner"></div>Loading football matches...</div>`;
    $("info").textContent = "";

    const titles = {
      all: "All Football Matches",
      today: "Today's Football Matches",
      tomorrow: "Tomorrow's Football Matches",
      live: "Live Football Matches",
      leagues: "Football Leagues"
    };
    $("title").textContent = titles[currentFilter];

    try {
      const data = await request(`/api/events?filter=${encodeURIComponent(filter)}`);
      if (version !== requestVersion) return;

      events = Array.isArray(data.events) ? data.events : [];
      loading = false;

      $("info").textContent =
        `Time zone: Ethiopia (EAT) · Today: ${data.today} · Matches: ${events.length}` +
        (data.paginationTruncated ? " · Not all API pages were loaded." : "");

      renderEvents();
    } catch (error) {
      if (version !== requestVersion) return;
      events = [];
      loading = false;
      $("events").innerHTML = `
        <div class="loading">❌ ${escapeHtml(error.message)}
          <br><br><button class="refresh" data-action="retry">Try Again</button>
        </div>`;
    }
  }

  function changeFilter(filter) {
    currentFilter = filter;
    selectedLeague = null;
    document.querySelectorAll("#nav button").forEach(button => {
      button.classList.toggle("active", button.dataset.filter === filter);
    });
    loadEvents();
  }

  function getFilteredEvents() {
    const search = $("search").value.toLowerCase().trim();
    return events.filter(event => {
      const text = `${event.home?.name || ""} ${event.away?.name || ""} ${event.league || ""}`
        .toLowerCase();
      return (!search || text.includes(search)) &&
        (selectedLeague === null || event.league === selectedLeague);
    });
  }

  function canBet(event) {
    return Boolean(
      event.providerId &&
      !event.live &&
      event.startTime &&
      Date.parse(event.startTime) > Date.now() &&
      !["finished", "postponed", "cancelled", "canceled", "abandoned", "suspended"]
        .includes(event.status)
    );
  }

  function priceFor(event, key) {
    const odds = event.odds || {};
    return ["1X", "X2", "12"].includes(key)
      ? odds.doubleChance?.[key]
      : odds[key];
  }

  function oddButton(event, key) {
    const definition = marketDefinitions.find(item => item.key === key);
    const price = Number(priceFor(event, key));
    const available = Number.isFinite(price) && price > 1;
    const selected = selections.some(item =>
      item.eventId === event.id && item.selection === key
    );

    return `
      <button class="odd ${selected ? "selected" : ""}"
        data-action="select"
        data-event="${escapeHtml(event.id)}"
        data-selection="${escapeHtml(key)}"
        ${!available || !canBet(event) ? "disabled" : ""}>
        <span class="odd-label">${escapeHtml(definition.label)}</span>
        <span class="odd-price">${available ? price.toFixed(2) : "-"}</span>
      </button>`;
  }

  function extraMarkets(event) {
    const groups = [
      ["Double Chance", ["1X", "12", "X2"]],
      ["Over / Under 1.5 Goals", ["over15", "under15"]],
      ["Over / Under 3.5 Goals", ["over35", "under35"]],
      ["Both Teams to Score", ["bttsYes", "bttsNo"]]
    ];

    return `<div class="extra">
      ${loadingOdds.has(event.id) ? '<div class="info">Loading odds...</div>' : ""}
      ${groups.map(([title, keys]) => `
        <div class="group-title">${escapeHtml(title)}</div>
        <div class="group">${keys.map(key => oddButton(event, key)).join("")}</div>
      `).join("")}
    </div>`;
  }

  function eventCard(event) {
    const expanded = expandedEvents.has(event.id);
    const status = event.live
      ? "🔴 LIVE"
      : `${formatDate(event.startTime)}${
          event.status !== "upcoming" ? " · " + escapeHtml(event.status) : ""
        }`;

    return `
      <div class="event">
        <div class="league">🏆 ${escapeHtml(event.league)}</div>
        <div class="event-head">
          <div class="team">
            <span class="team-name">${escapeHtml(event.home?.name || "Home")}</span>
            ${event.live || event.status === "finished"
              ? `<span>${escapeHtml(event.score?.home ?? "-")}</span>` : ""}
          </div>
          <div class="team">
            <span class="team-name">${escapeHtml(event.away?.name || "Away")}</span>
            ${event.live || event.status === "finished"
              ? `<span>${escapeHtml(event.score?.away ?? "-")}</span>` : ""}
          </div>
          <div class="match-status ${event.live ? "live" : ""}">${status}</div>
        </div>
        <div class="markets">
          ${["1", "X", "2", "over25", "under25", "bttsYes"]
            .map(key => oddButton(event, key)).join("")}
          <button class="more" data-action="more" data-event="${escapeHtml(event.id)}">
            ${expanded ? "▲ Hide Markets" : "▼ More Markets"}
          </button>
          ${expanded ? extraMarkets(event) : ""}
        </div>
      </div>`;
  }

  function renderEvents() {
    if (loading) return;
    const container = $("events");

    if (currentFilter === "leagues" && selectedLeague === null) {
      const search = $("search").value.toLowerCase().trim();
      const leagues = [...new Set(events.map(event => event.league))]
        .filter(Boolean)
        .filter(league => !search || league.toLowerCase().includes(search))
        .sort();

      container.innerHTML = leagues.length
        ? `<div class="leagues">${leagues.map(league => `
            <button class="refresh" data-action="league" data-league="${escapeHtml(league)}">
              🏆 ${escapeHtml(league)}
            </button>`).join("")}</div>`
        : '<div class="loading">No leagues found in the returned matches.</div>';
      return;
    }

    const filtered = getFilteredEvents();
    const back = currentFilter === "leagues"
      ? '<button class="refresh" data-action="back" style="margin-bottom:12px">← Back to Leagues</button>'
      : "";

    if (!filtered.length) {
      const text = currentFilter === "today"
        ? "No matches for today were returned by BSD."
        : currentFilter === "tomorrow"
          ? "No matches for tomorrow were returned by BSD."
          : "No football matches found.";
      container.innerHTML = back + `<div class="loading">${text}</div>`;
      return;
    }

    container.innerHTML = back + filtered.map(eventCard).join("");
  }

  async function toggleMoreOdds(eventId) {
    if (expandedEvents.has(eventId)) {
      expandedEvents.delete(eventId);
      renderEvents();
      return;
    }

    expandedEvents.add(eventId);
    const event = events.find(item => item.id === eventId);
    if (!event?.providerId || loadingOdds.has(eventId)) {
      renderEvents();
      return;
    }

    loadingOdds.add(eventId);
    renderEvents();

    try {
      const data = await request(`/api/events/${encodeURIComponent(eventId)}/odds`);
      const current = events.find(item => item.id === eventId);
      if (current) current.odds = data.odds;
    } catch (error) {
      showMessage(error.message, "error");
    } finally {
      loadingOdds.delete(eventId);
      renderEvents();
    }
  }

  function toggleSelection(eventId, key) {
    if (submitting) return;
    const event = events.find(item => item.id === eventId);
    const definition = marketDefinitions.find(item => item.key === key);
    if (!event || !definition || !canBet(event)) return;

    const price = Number(priceFor(event, key));
    if (!Number.isFinite(price) || price <= 1) return;

    const existing = selections.findIndex(item =>
      item.eventId === eventId && item.selection === key
    );

    if (existing >= 0) {
      selections.splice(existing, 1);
    } else {
      const item = {
        eventId,
        match: `${event.home.name} vs ${event.away.name}`,
        market: definition.group,
        label: definition.label,
        selection: key,
        odds: price
      };

      if (betType === "single") {
        selections = [item];
      } else {
        // Same-match correlated selections are not combined.
        selections = selections.filter(selected => selected.eventId !== eventId);
        selections.push(item);
      }
    }

    renderEvents();
    updateSlip();
  }

  function setBetType(type) {
    if (submitting) return;
    betType = type;
    if (type === "single" && selections.length > 1) {
      selections = [selections[0]];
      showMessage("Single keeps only one selection.");
    }
    $("singleBtn").classList.toggle("active", type === "single");
    $("comboBtn").classList.toggle("active", type === "combo");
    renderEvents();
    updateSlip();
  }

  function updateSlip() {
    $("betControls").hidden = !selections.length;
    const box = $("slipSelections");

    if (!selections.length) {
      box.className = "empty";
      box.textContent = "Select odds to add them to your bet slip.";
      return;
    }

    box.className = "";
    box.innerHTML = selections.map((item, index) => `
      <div class="selection">
        <div class="selection-top">
          <div class="selection-name">${escapeHtml(item.label)}</div>
          <div class="selection-odds">${item.odds.toFixed(2)}</div>
        </div>
        <div class="selection-match">${escapeHtml(item.match)}</div>
        <button class="remove" data-remove="${index}">✕ Remove</button>
      </div>`).join("");

    const totalOdds = selections.reduce((total, item) => total * item.odds, 1);
    const stake = Number($("stake").value) || 0;

    $("selectionCount").textContent = selections.length;
    $("totalOdds").textContent = totalOdds.toFixed(2);
    $("stakeDisplay").textContent = money(stake);
    $("potentialWin").textContent = money(stake * totalOdds);
  }

  async function placeBet() {
    if (submitting) return;
    if (!selections.length) {
      showMessage("Please select odds first.", "error");
      return;
    }
    if (betType === "combo" && selections.length < 2) {
      showMessage("Combo needs at least two different matches.", "error");
      return;
    }

    const stake = Number($("stake").value);
    if (!Number.isFinite(stake) || stake <= 0) {
      showMessage("Please enter a valid stake.", "error");
      return;
    }

    submitting = true;
    $("placeBtn").disabled = true;
    $("placeBtn").textContent = "Placing Bet...";

    try {
      const data = await request("/api/bet", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          userId, betType, stake,
          selections: selections.map(item => ({ ...item }))
        })
      });

      $("balance").textContent = money(data.wallet.balance);
      selections = [];
      showMessage("Demo bet placed successfully!");
      renderEvents();
      updateSlip();
    } catch (error) {
      showMessage(error.message, "error");
    } finally {
      submitting = false;
      $("placeBtn").disabled = false;
      $("placeBtn").textContent = "PLACE DEMO BET";
    }
  }

  $("nav").addEventListener("click", event => {
    const button = event.target.closest("button[data-filter]");
    if (button) changeFilter(button.dataset.filter);
  });

  $("events").addEventListener("click", event => {
    const button = event.target.closest("button[data-action]");
    if (!button || button.disabled) return;

    const action = button.dataset.action;
    if (action === "retry") loadEvents();
    if (action === "select") {
      toggleSelection(button.dataset.event, button.dataset.selection);
    }
    if (action === "more") toggleMoreOdds(button.dataset.event);
    if (action === "league") {
      selectedLeague = button.dataset.league;
      renderEvents();
    }
    if (action === "back") {
      selectedLeague = null;
      renderEvents();
    }
  });

  $("slipSelections").addEventListener("click", event => {
    const button = event.target.closest("button[data-remove]");
    if (!button || submitting) return;
    selections.splice(Number(button.dataset.remove), 1);
    renderEvents();
    updateSlip();
  });

  $("refresh").addEventListener("click", loadEvents);
  $("search").addEventListener("input", renderEvents);
  $("stake").addEventListener("input", updateSlip);
  $("singleBtn").addEventListener("click", () => setBetType("single"));
  $("comboBtn").addEventListener("click", () => setBetType("combo"));
  $("placeBtn").addEventListener("click", placeBet);

  loadWallet();
  loadEvents();
</script>
</body>
</html>
