<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>BetEthio - All Markets</title>
    <style>
        :root {
            --primary: #facc15;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --muted: #94a3b8;
            --accent: #22c55e;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; 
            font-family: -apple-system, system-ui, sans-serif; 
            background: var(--bg); 
            color: var(--text);
            padding-bottom: 80px;
        }
        .header {
            background: var(--card);
            padding: 15px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }
        .balance { color: var(--primary); font-weight: bold; }
        
        .container { padding: 10px; }
        .match {
            background: var(--card);
            border-radius: 12px;
            margin-bottom: 15px;
            overflow: hidden;
            border: 1px solid #334155;
        }
        .matchhead { padding: 10px 15px; background: #33415533; display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
        .teams { padding: 15px; text-align: center; }
        .team { font-size: 18px; font-weight: bold; margin: 5px 0; }
        .vs { font-size: 12px; color: var(--muted); }
        
        .market-group { padding: 10px 15px; border-top: 1px solid #334155; }
        .market-title { font-size: 12px; font-weight: bold; color: var(--primary); margin-bottom: 10px; text-transform: uppercase; }
        .markets { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .odd {
            background: #0f172a;
            border: 1px solid #334155;
            color: var(--text);
            padding: 10px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }
        .odd.active { background: var(--primary); color: #000; border-color: var(--primary); }
        .odd.disabled { opacity: 0.5; pointer-events: none; }
        .price { font-weight: bold; color: var(--primary); }
        .active .price { color: #000; }

        .score-live { background: var(--accent); color: white; padding: 2px 8px; border-radius: 4px; font-weight: bold; margin: 5px auto; width: fit-content; }
        .live-dot { height: 8px; width: 8px; background: var(--accent); border-radius: 50%; display: inline-block; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div class="header">
    <div class="brand">BetEthio</div>
    <div class="balance" id="user-balance">0.00 ETB</div>
</div>

<div class="container" id="match-container">
    <div style="text-align:center; padding:50px; color:var(--muted)">Loading matches and all markets...</div>
</div>

<script>
    const state = {
        matches: [],
        selected: []
    };

    async function loadData() {
        try {
            const res = await fetch('/api/football/betting?limit=20');
            const data = await res.json();
            if (data.success) {
                state.matches = data.matches;
                render();
            }
        } catch (e) {
            console.error(e);
        }
    }

    function render() {
        const container = document.getElementById('match-container');
        container.innerHTML = '';

        state.matches.forEach(m => {
            const card = document.createElement('div');
            card.className = 'match';
            
            let marketsHtml = '';
            if (m.markets && Object.keys(m.markets).length > 0) {
                marketsHtml = Object.entries(m.markets).map(([key, outcomes]) => `
                    <div class="market-group">
                        <div class="market-title">${key.replace(/_/g, ' ')}</div>
                        <div class="markets">
                            ${outcomes.map(o => {
                                const selId = `${m.id}_${key}_${o.name}`;
                                const isActive = state.selected.some(s => s.id === selId);
                                const label = o.handicap ? `${o.name} (${o.handicap})` : o.name;
                                return `
                                    <button class="odd ${isActive ? 'active' : ''} ${m.is_live ? 'disabled' : ''}" 
                                        onclick="toggleSelection('${m.id}', '${key}', '${o.name}', ${o.odd})">
                                        <span>${label}</span>
                                        <span class="price">${o.odd.toFixed(2)}</span>
                                    </button>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `).join('');
            } else {
                marketsHtml = '<div style="padding:20px; text-align:center; color:var(--muted)">No odds available for this match</div>';
            }

            card.innerHTML = `
                <div class="matchhead">
                    <div>${m.league}</div>
                    <div>${m.is_live ? '<span class="live-dot"></span> LIVE' : new Date(m.date).toLocaleTimeString()}</div>
                </div>
                <div class="teams">
                    <div class="team">${m.home_team}</div>
                    <div class="vs">VS</div>
                    <div class="team">${m.away_team}</div>
                </div>
                ${marketsHtml}
            `;
            container.appendChild(card);
        });
    }

    function toggleSelection(matchId, market, outcome, odd) {
        const selId = `${matchId}_${market}_${outcome}`;
        const idx = state.selected.findIndex(s => s.id === selId);
        if (idx > -1) {
            state.selected.splice(idx, 1);
        } else {
            state.selected.push({ id: selId, matchId, market, outcome, odd });
        }
        render();
    }

    loadData();
    setInterval(loadData, 30000);
</script>
</body>
</html>
