<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>BetEthio Pro - Leagues & Accumulator</title>
    <style>
        :root {
            --primary: #facc15;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --muted: #94a3b8;
            --accent: #22c55e;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { 
            margin: 0; 
            font-family: -apple-system, system-ui, sans-serif; 
            background: var(--bg); 
            color: var(--text);
            padding-bottom: 100px;
        }

        /* Top Navigation */
        .header {
            background: var(--card);
            padding: 12px 15px;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid #334155;
        }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .brand { font-weight: 800; font-size: 20px; color: var(--primary); }
        .balance { font-weight: bold; background: #0f172a; padding: 4px 10px; border-radius: 20px; border: 1px solid var(--primary); }

        /* Time Filters */
        .time-filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; }
        .time-filters::-webkit-scrollbar { display: none; }
        .filter-btn {
            background: #334155;
            border: none;
            color: var(--text);
            padding: 8px 16px;
            border-radius: 20px;
            white-space: nowrap;
            font-size: 13px;
            font-weight: 600;
        }
        .filter-btn.active { background: var(--primary); color: #000; }

        /* League Dropdown */
        .league-select-container { padding: 10px 15px; }
        #league-select {
            width: 100%;
            background: var(--card);
            color: var(--text);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            font-size: 14px;
        }

        .container { padding: 10px; }
        
        /* Match Card */
        .match {
            background: var(--card);
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid #334155;
            overflow: hidden;
        }
        .match-header { padding: 8px 15px; background: #33415566; display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
        .teams-area { padding: 15px; text-align: center; border-bottom: 1px solid #33415533; }
        .team-name { font-size: 16px; font-weight: 700; margin: 4px 0; }
        .vs-text { font-size: 11px; color: var(--muted); text-transform: uppercase; }

        /* Market Section */
        .market-group { padding: 10px 15px; border-bottom: 1px solid #33415533; }
        .market-label { font-size: 11px; color: var(--primary); font-weight: bold; margin-bottom: 8px; }
        .odds-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .odd-btn {
            background: #0f172a;
            border: 1px solid #334155;
            color: var(--text);
            padding: 10px 4px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 13px;
            transition: 0.2s;
        }
        .odd-btn .val { font-weight: 800; color: var(--primary); margin-top: 2px; }
        .odd-btn.active { background: var(--primary); border-color: var(--primary); color: #000; }
        .odd-btn.active .val { color: #000; }
        .odd-btn:disabled { opacity: 0.4; }

        /* Floating Bet Slip Bar */
        .slip-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--primary);
            color: #000;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            z-index: 2000;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.3);
            display: none;
        }
        .slip-count { background: #000; color: #fff; border-radius: 50%; width: 24px; height: 24px; display: inline-flex; justify-content: center; align-items: center; margin-right: 8px; }

        .live-tag { color: var(--accent); font-weight: bold; display: flex; align-items: center; gap: 4px; }
        .dot { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }

        /* Full Screen Slip Overlay */
        #slip-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg);
            z-index: 3000;
            display: none;
            flex-direction: column;
        }
        .overlay-header { padding: 15px; background: var(--card); display: flex; justify-content: space-between; align-items: center; }
        .slip-items { flex: 1; overflow-y: auto; padding: 15px; }
        .slip-item { background: var(--card); padding: 12px; border-radius: 8px; margin-bottom: 10px; position: relative; }
        .remove-item { position: absolute; top: 10px; right: 10px; color: var(--danger); font-weight: bold; }
        .stake-area { padding: 20px; background: var(--card); border-top: 1px solid #334155; }
        .stake-input { width: 100%; padding: 15px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 18px; text-align: center; }
    </style>
</head>
<body>

<div class="header">
    <div class="top-bar">
        <div class="brand">BetEthio</div>
        <div class="balance" id="balance-display">0.00 ETB</div>
    </div>
    <div class="time-filters">
        <button class="filter-btn active" onclick="setTimeFilter('all')">All</button>
        <button class="filter-btn" onclick="setTimeFilter('live')">Live</button>
        <button class="filter-btn" onclick="setTimeFilter('today')">Today</button>
        <button class="filter-btn" onclick="setTimeFilter('tomorrow')">Tomorrow</button>
    </div>
</div>

<div class="league-select-container">
    <select id="league-select" onchange="setLeagueFilter(this.value)">
        <option value="all">All Leagues</option>
    </select>
</div>

<div class="container" id="match-list"></div>

<div class="slip-bar" id="slip-bar" onclick="toggleSlip(true)">
    <div><span class="slip-count" id="count-ui">0</span> Bet Slip</div>
    <div id="total-odds-ui">Total Odds: 1.00</div>
</div>

<div id="slip-overlay">
    <div class="overlay-header">
        <div style="font-weight: 800;">YOUR BET SLIP</div>
        <button onclick="toggleSlip(false)" style="background:none; border:none; color:var(--primary); font-weight:bold;">CLOSE</button>
    </div>
    <div class="slip-items" id="slip-content"></div>
    <div class="stake-area">
        <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
            <span>Possible Win:</span>
            <span id="win-ui" style="color:var(--accent); font-weight:bold;">0.00 ETB</span>
        </div>
        <input type="number" class="stake-input" id="stake-amount" placeholder="Enter Stake Amount" oninput="updatePotentialWin()">
        <button onclick="placeBet()" style="width:100%; padding:15px; background:var(--primary); border:none; border-radius:8px; margin-top:15px; font-weight:bold; font-size:16px;">PLACE BET</button>
    </div>
</div>

<script>
    let rawData = [];
    let state = {
        timeFilter: 'all',
        leagueFilter: 'all',
        selected: [] 
    };

    async function fetchData() {
        try {
            const res = await fetch('/api/football/betting?limit=100');
            const data = await res.json();
            if (data.success) {
                rawData = data.matches;
                updateLeagueDropdown();
                renderMatches();
            }
        } catch (e) { console.error("Fetch error:", e); }
    }

    function updateLeagueDropdown() {
        const select = document.getElementById('league-select');
        const leagues = [...new Set(rawData.map(m => m.league))].sort();
        const current = state.leagueFilter;
        select.innerHTML = '<option value="all">All Leagues</option>';
        leagues.forEach(l => {
            const opt = document.createElement('option');
            opt.value = l;
            opt.textContent = l;
            select.appendChild(opt);
        });
        select.value = current;
    }

    function setTimeFilter(f) {
        state.timeFilter = f;
        document.querySelectorAll('.filter-btn').forEach(b => {
            b.classList.toggle('active', b.textContent.toLowerCase() === f);
        });
        renderMatches();
    }

    function setLeagueFilter(f) {
        state.leagueFilter = f;
        renderMatches();
    }

    function renderMatches() {
        const container = document.getElementById('match-list');
        container.innerHTML = '';
        const now = new Date();
        const tomorrow = new Date(); tomorrow.setDate(now.getDate() + 1);

        let filtered = rawData.filter(m => {
            if (state.leagueFilter !== 'all' && m.league !== state.leagueFilter) return false;
            const mDate = new Date(m.date);
            const isLive = m.is_live || (m.status && m.status.toLowerCase().includes('live'));
            if (state.timeFilter === 'live') return isLive;
            if (state.timeFilter === 'today') return mDate.toDateString() === now.toDateString();
            if (state.timeFilter === 'tomorrow') return mDate.toDateString() === tomorrow.toDateString();
            return true;
        });

        if (filtered.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:40px; color:var(--muted);">No matches found.</div>';
            return;
        }

        filtered.forEach(m => {
            const card = document.createElement('div');
            card.className = 'match';
            let marketsHtml = '';
            if (m.markets) {
                marketsHtml = Object.entries(m.markets).map(([mKey, outcomes]) => `
                    <div class="market-group">
                        <div class="market-label">${mKey.toUpperCase()}</div>
                        <div class="odds-grid">
                            ${outcomes.map(o => {
                                const selId = `${m.id}_${mKey}_${o.name}`;
                                const isActive = state.selected.some(s => s.id === selId);
                                return `<button class="odd-btn ${isActive ? 'active' : ''}" onclick="toggleSelection('${m.id}', '${mKey}', '${o.name}', ${o.odd}, '${m.home_team} vs ${m.away_team}')">
                                    <span style="font-size:10px">${o.name}</span>
                                    <span class="val">${o.odd.toFixed(2)}</span>
                                </button>`;
                            }).join('')}
                        </div>
                    </div>
                `).join('');
            }
            card.innerHTML = `
                <div class="match-header">
                    <span>${m.league}</span>
                    <span>${m.is_live ? '<div class="live-tag"><div class="dot"></div>LIVE</div>' : new Date(m.date).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
                </div>
                <div class="teams-area"><div class="team-name">${m.home_team}</div><div class="vs-text">vs</div><div class="team-name">${m.away_team}</div></div>
                ${marketsHtml}
            `;
            container.appendChild(card);
        });
    }

    function toggleSelection(matchId, market, outcome, odd, teams) {
        const selId = `${matchId}_${market}_${outcome}`;
        const existingIdx = state.selected.findIndex(s => s.id === selId);
        if (existingIdx > -1) {
            state.selected.splice(existingIdx, 1);
        } else {
            state.selected = state.selected.filter(s => s.matchId !== matchId);
            state.selected.push({ id: selId, matchId, market, outcome, odd, teams });
        }
        updateSlipUI();
        renderMatches();
    }

    function updateSlipUI() {
        const bar = document.getElementById('slip-bar');
        const count = state.selected.length;
        bar.style.display = count > 0 ? 'flex' : 'none';
        document.getElementById('count-ui').textContent = count;
        const totalOdd = state.selected.reduce((acc, curr) => acc * curr.odd, 1);
        document.getElementById('total-odds-ui').textContent = `Total Odds: ${totalOdd.toFixed(2)}`;
    }

    function toggleSlip(show) {
        document.getElementById('slip-overlay').style.display = show ? 'flex' : 'none';
        if (show) {
            const content = document.getElementById('slip-content');
            content.innerHTML = state.selected.map(s => `
                <div class="slip-item">
                    <div class="remove-item" onclick="toggleSelection('${s.matchId}', '${s.market}', '${s.outcome}', ${s.odd}); renderSlipItems();">X</div>
                    <div style="font-size:12px; color:var(--muted);">${s.teams}</div>
                    <div style="font-weight:bold; margin:5px 0;">${s.market.toUpperCase()}: ${s.outcome}</div>
                    <div style="color:var(--primary); font-weight:bold;">@ ${s.odd.toFixed(2)}</div>
                </div>
            `).join('');
            updatePotentialWin();
        }
    }

    function renderSlipItems() { toggleSlip(true); }

    function updatePotentialWin() {
        const stake = parseFloat(document.getElementById('stake-amount').value) || 0;
        const totalOdd = state.selected.reduce((acc, curr) => acc * curr.odd, 1);
        document.getElementById('win-ui').textContent = (stake * totalOdd).toFixed(2) + ' ETB';
    }

    function placeBet() {
        alert("Bet Placed Successfully!");
        state.selected = [];
        toggleSlip(false);
        updateSlipUI();
        renderMatches();
    }

    fetchData();
    setInterval(fetchData, 45000);
</script>
</body>
</html>
